name: Validate Release Provenance

on:
  pull_request:
    paths:
      - '.github/actions/checkout-llama-ref/action.yml'
      - '.github/workflows/auto_native_release.yml'
      - '.github/workflows/native_release.yml'
      - '.github/workflows/validate_release_provenance.yml'
      - 'scripts/generate_assets_manifest.sh'
      - 'scripts/release_version_policy.py'
      - 'scripts/verify_release_provenance.py'
      - 'tests/test_release_version_policy.py'
  push:
    branches:
      - main
    paths:
      - '.github/actions/checkout-llama-ref/action.yml'
      - '.github/workflows/auto_native_release.yml'
      - '.github/workflows/native_release.yml'
      - '.github/workflows/validate_release_provenance.yml'
      - 'scripts/generate_assets_manifest.sh'
      - 'scripts/release_version_policy.py'
      - 'scripts/verify_release_provenance.py'
      - 'tests/test_release_version_policy.py'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify release version policy
        run: python3 tests/test_release_version_policy.py
      - name: Verify release provenance contracts
        run: python3 scripts/verify_release_provenance.py
