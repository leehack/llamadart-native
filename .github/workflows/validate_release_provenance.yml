name: Validate Release Provenance

on:
  pull_request:
    paths:
      - '.github/actions/checkout-llama-ref/action.yml'
      - '.github/workflows/auto_native_release.yml'
      - '.github/workflows/native_release.yml'
      - '.github/workflows/validate_release_provenance.yml'
      - '.github/workflows/validate_wrapper.yml'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'docs/release_version_policy.md'
      - 'scripts/auto_release_dispatch.py'
      - 'scripts/generate_assets_manifest.sh'
      - 'scripts/release_contract.py'
      - 'scripts/release_publication.py'
      - 'scripts/release_version_policy.py'
      - 'scripts/verify_historical_release_metadata.py'
      - 'scripts/verify_release_provenance.py'
      - 'tests/package_linux_artifact_test.py'
      - 'tests/validate_linux_artifact_test.py'
      - 'tools/linux_dlopen_smoke.c'
      - 'tools/package_linux_artifact.py'
      - 'tools/validate_linux_artifact.py'
      - 'tests/fixtures/historical_release_metadata.json'
      - 'tests/test_historical_release_metadata.py'
      - 'tests/test_auto_release_dispatch.py'
      - 'tests/test_release_contract.py'
      - 'tests/test_release_publication.py'
      - 'tests/test_release_version_policy.py'
      - 'tests/test_release_workflow_inputs.py'
  push:
    branches:
      - main
    paths:
      - '.github/actions/checkout-llama-ref/action.yml'
      - '.github/workflows/auto_native_release.yml'
      - '.github/workflows/native_release.yml'
      - '.github/workflows/validate_release_provenance.yml'
      - '.github/workflows/validate_wrapper.yml'
      - 'CONTRIBUTING.md'
      - 'README.md'
      - 'docs/release_version_policy.md'
      - 'scripts/auto_release_dispatch.py'
      - 'scripts/generate_assets_manifest.sh'
      - 'scripts/release_contract.py'
      - 'scripts/release_publication.py'
      - 'scripts/release_version_policy.py'
      - 'scripts/verify_historical_release_metadata.py'
      - 'scripts/verify_release_provenance.py'
      - 'tests/package_linux_artifact_test.py'
      - 'tests/validate_linux_artifact_test.py'
      - 'tools/linux_dlopen_smoke.c'
      - 'tools/package_linux_artifact.py'
      - 'tools/validate_linux_artifact.py'
      - 'tests/fixtures/historical_release_metadata.json'
      - 'tests/test_historical_release_metadata.py'
      - 'tests/test_auto_release_dispatch.py'
      - 'tests/test_release_contract.py'
      - 'tests/test_release_publication.py'
      - 'tests/test_release_version_policy.py'
      - 'tests/test_release_workflow_inputs.py'

permissions:
  contents: read

jobs:
  python310-linux-artifact-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Test Linux artifact tools on Python 3.10
        run: >-
          python -m unittest
          tests.package_linux_artifact_test
          tests.validate_linux_artifact_test

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release version policy
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify immutable historical release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_historical_release_metadata.py --live --repository "$GITHUB_REPOSITORY"
      - name: Verify release provenance contracts
        run: python3 scripts/verify_release_provenance.py
      - name: Test Linux artifact tools
        run: python3 -m unittest discover -s tests -p '*_test.py'
