name: Validate Wrapper

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Qualification only: never moves the production submodule or release channel.
  LLAMADART_QUALIFICATION_SHA: 73ab7599b553c03f6f5d2db24a18ad76f2eb36a3
  LLAMADART_V041_QUALIFICATION_SHA: b29c606e28a01b1bc8c1351026a0fa6e616bf6c4
  LLAMADART_V050_QUALIFICATION_SHA: 7fe450e19305b828c199d602c23a8337aaa1f03b
  LLAMADART_V060_QUALIFICATION_SHA: d81235049384534c167caea52b85a694f6103d14

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test change selection
        run: python3 -m unittest discover -s tests -p test_ci_scope.py
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 tools/ci_scope.py

  android-arm64-isa:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        upstream: [post-v0.4.0, v0.4.1, v0.5.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select candidate upstream
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || matrix.upstream == 'v0.4.1' && env.LLAMADART_V041_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build and audit the release ARMv8.2 CPU variant
        run: |
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          python3 - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build
          name, arch, features = build.ANDROID_ARM64_CPU_VARIANTS[2]
          build.build_android_arm64_cpu_variant(
              name, arch, features, build_dir=Path('build/android-isa').resolve(),
              ndk=Path(os.environ['ANDROID_NDK_HOME']), env=dict(os.environ), jobs=4)
          PY
          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          python3 tools/validate_android_cpu_isa.py \
            --objdump "$LLVM/llvm-objdump" --readelf "$LLVM/llvm-readelf" \
            --llama-source third_party/llama.cpp \
            --kleidiai-source build/android-isa/_deps/kleidiai-src \
            build/android-isa/bin/libggml-cpu.so

  android-vulkan-shaders:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, v0.5.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select candidate upstream
        if: matrix.upstream != 'pinned'
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;28.2.13676358
      - name: Install build dependencies and the release glslc
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build glslc
          glslc --version
      - name: Build the release Android Vulkan backend
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          ANDROID_VULKAN_GLSLC="$(command -v glslc)"
          export ANDROID_VULKAN_GLSLC
          python3 - <<'PY' 2>&1 | tee configure-build.log
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import build
          abi = 'arm64-v8a'
          build_dir = Path('build/android-vulkan').resolve()
          env = dict(os.environ)
          args = build.android_configure_args(
              abi, build_dir=build_dir, ndk=Path(env['ANDROID_NDK_HOME']), env=env,
              cache_vars=build.android_backend_cache_vars(abi, 'vulkan'), jobs=4)
          build.configure_and_build_dir(
              build_dir, jobs=4, cmake_args=args, build_target='ggml-vulkan', env=env)
          PY
          grep -F -- "-DVulkan_GLSLC_EXECUTABLE=$ANDROID_VULKAN_GLSLC" configure-build.log
          grep -Fx -- '-- GL_KHR_cooperative_matrix supported by glslc' configure-build.log
          test -f build/android-vulkan/bin/libggml-vulkan.so
      # The release takes the Android core libraries from this configuration,
      # and no other pull request lane compiles the wrapper with the NDK.
      - name: Build the wrapper and check the bundle's exception runtime
        if: matrix.upstream == 'pinned'
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/28.2.13676358"
          cmake --build build/android-vulkan --target llamadart_lib ggml-cpu --parallel 4
          LLVM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir build/android-vulkan/bundle
          cp build/android-vulkan/libllamadart.so build/android-vulkan/bin/*.so build/android-vulkan/bundle/
          python3 tools/validate_android_artifacts.py \
            --readelf "$LLVM/llvm-readelf" build/android-vulkan/bundle
          python3 tools/validate_exports.py --format readelf \
            --tool "$LLVM/llvm-readelf" build/android-vulkan/bundle/libllamadart.so

  kleidiai-dispatch-emulated:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        upstream: [post-v0.4.0, v0.4.1, v0.5.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select candidate upstream
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || matrix.upstream == 'v0.4.1' && env.LLAMADART_V041_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - name: Install cross compiler and CPU emulator
        run: sudo apt-get update && sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
      - name: Build the real baseline CPU and dispatch test
        run: >-
          cmake -S . -B build/kleidiai-dispatch -G Ninja
          -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=aarch64
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          -DCMAKE_BUILD_TYPE=Release -DGGML_CPU_ARM_ARCH=armv8-a
          -DGGML_CPU_KLEIDIAI=ON -DGGML_OPENMP=OFF
          -DGGML_VULKAN=OFF -DGGML_BLAS=OFF -DGGML_CCACHE=OFF
          -DLLAMADART_BUILD_KLEIDIAI_TESTS=ON
      - name: Compile dispatch and quantized compute qualification
        run: cmake --build build/kleidiai-dispatch --target llamadart_kleidiai_dispatch_test --parallel 4
      - name: Run without SVE on baseline and optimized CPU profiles
        run: |
          for CPU in cortex-a53 max,sve=off,sme=off; do
            qemu-aarch64 -cpu "$CPU" -L /usr/aarch64-linux-gnu \
              -E LD_LIBRARY_PATH="$PWD/build/kleidiai-dispatch/bin" \
              build/kleidiai-dispatch/bin/llamadart_kleidiai_dispatch_test
            qemu-aarch64 -cpu "$CPU" -L /usr/aarch64-linux-gnu \
              -E GGML_KLEIDIAI_SME=1 \
              -E LD_LIBRARY_PATH="$PWD/build/kleidiai-dispatch/bin" \
              build/kleidiai-dispatch/bin/llamadart_kleidiai_dispatch_test
          done

  windows-arm64-kleidiai:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, post-v0.4.0, v0.5.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup ARM64 MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: arm64
      - name: Select candidate upstream
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        if: matrix.upstream != 'pinned'
        shell: bash
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - name: Verify assembly policy regressions
        run: python -m unittest discover -s tests -p test_kleidiai_windows.py
      - name: Configure release compiler and optimized CPU
        run: >-
          cmake --preset windows-arm64-full
          -DGGML_BLAS=OFF -DGGML_VULKAN=OFF -DGGML_CUDA=OFF
          -DGGML_OPENCL=OFF -DGGML_OPENMP=OFF -DGGML_CCACHE=OFF
          -DGGML_CPU_KLEIDIAI=ON -DLLAMADART_BUILD_TESTS=ON
      - name: Build wrapper and CPU contracts
        run: cmake --build --preset windows-arm64-full --parallel 4
      - name: Run native wrapper contracts
        run: |
          $wrapperDir = (Resolve-Path build/wa64/Release).Path
          $upstreamDir = (Resolve-Path build/wa64/bin/Release).Path
          $env:PATH = "$wrapperDir;$upstreamDir;$env:PATH"
          ctest --test-dir build/wa64 -C Release --timeout 120 --verbose --output-on-failure

  windows-arm64-vulkan:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, v0.5.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup ARM64 MSVC environment
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: arm64
      - name: Select candidate upstream
        if: matrix.upstream != 'pinned'
        shell: bash
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - name: Install the release Vulkan SDK
        uses: ./.github/actions/install-vulkan-sdk-windows
        with:
          arch: arm64
      - name: Build the release Windows ARM64 Vulkan lane
        run: python tools/build.py windows --arch arm64 --backend vulkan
      - name: Check the backend is ARM64 and imports the Vulkan loader
        run: |
          $dll = "bin/windows/arm64/ggml-vulkan.dll"
          if (-not (Test-Path $dll)) { throw "Missing $dll" }
          $headers = (& dumpbin /headers $dll) -join "`n"
          if ($headers -notmatch "\(ARM64\)") { throw "$dll is not ARM64" }
          $deps = (& dumpbin /dependents $dll) -join "`n"
          if ($deps -notmatch "(?im)^\s*vulkan-1\.dll\s*$") { throw "$dll does not import vulkan-1.dll" }

  linux-artifact-contract:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: ${{ matrix.upstream == 'pinned' && format('linux-artifact-contract ({0})', matrix.arch) || format('linux-artifact-contract ({0}, {1})', matrix.arch, matrix.upstream) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
        upstream: [pinned, post-v0.4.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Select candidate upstream
        if: matrix.upstream != 'pinned'
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - name: Install Linux build and emulation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          if [ "${{ matrix.arch }}" = "x64" ] && [ "${{ matrix.upstream }}" = "pinned" ]; then
            sudo apt-get install -y clang lld
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
          fi
      - name: Verify mixed-compiler static retention
        if: matrix.arch == 'x64' && matrix.upstream == 'pinned'
        run: |
          command -v gcc clang++ cmake readelf ld.lld
          python3 -m unittest discover -s tests -p test_linux_static_destructors.py
      - name: Build CPU-only Linux runtime
        run: python3 tools/build.py linux --arch "${{ matrix.arch }}" --backend cpu --jobs 2
      - name: Package and inspect Linux runtime
        run: |
          python3 tools/package_linux_artifact.py \
            --input-dir "bin/linux/${{ matrix.arch }}" \
            --output "linux-${{ matrix.arch }}.tar.gz"
          python3 tools/validate_linux_artifact.py "linux-${{ matrix.arch }}.tar.gz"
      - name: Validate clean consumer dlopen
        run: |
          EXTRACT_DIR="${RUNNER_TEMP}/llamadart-clean-${{ matrix.arch }}"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "linux-${{ matrix.arch }}.tar.gz" -C "$EXTRACT_DIR"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            aarch64-linux-gnu-gcc tools/linux_dlopen_smoke.c -o "${RUNNER_TEMP}/linux-dlopen-smoke-arm64" -ldl
            env -u LD_LIBRARY_PATH qemu-aarch64 -L /usr/aarch64-linux-gnu \
              "${RUNNER_TEMP}/linux-dlopen-smoke-arm64" "$EXTRACT_DIR/libllamadart.so"
          else
            cc tools/linux_dlopen_smoke.c -o "${RUNNER_TEMP}/linux-dlopen-smoke-x64" -ldl
            env -u LD_LIBRARY_PATH \
              "${RUNNER_TEMP}/linux-dlopen-smoke-x64" "$EXTRACT_DIR/libllamadart.so"
          fi

  wrapper-contract:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: ${{ matrix.upstream == 'pinned' && 'wrapper-contract' || format('wrapper-contract ({0})', matrix.upstream) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, post-v0.4.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select the candidate upstream release
        if: matrix.upstream != 'pinned'
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      # lavapipe, so that the Vulkan device facts are read from a real loader.
      - name: Install the Mesa software Vulkan device
        run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: Configure wrapper contract tests
        run: >-
          cmake -S . -B build/wrapper-contract -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DGGML_NATIVE=OFF
          -DGGML_OPENMP=OFF
          -DLLAMADART_BUILD_TESTS=ON
          -DLLAMADART_BUILD_TTS_SMOKE=ON
      - name: Build wrapper contract tests and smoke tool
        run: >-
          cmake --build build/wrapper-contract --target
          llamadart_speculative_api_test
          llamadart_tts_api_test
          llamadart_tts_eval_test
          llamadart_mtmd_compat_test
          llamadart_image_token_limit_test
          llamadart_barrier_test
          llamadart_vulkan_device_info_test
          llamadart_exit_teardown_test
          llamadart_tts_smoke
      - name: Run wrapper contract tests
        run: ctest --test-dir build/wrapper-contract --output-on-failure
      # ggml-vulkan uses a CPU implementation only when it is asked to.
      - name: Read the software Vulkan device through the wrapper
        env:
          GGML_VK_VISIBLE_DEVICES: '0'
          LLAMADART_TEST_VULKAN_DEVICES: '1'
        run: build/wrapper-contract/llamadart_vulkan_device_info_test
      - name: Validate public grammar sampler boundary
        run: python3 tools/validate_grammar_boundary.py build/wrapper-contract/libllamadart.so
      - name: Validate wrapper exports
        run: >-
          python3 tools/validate_exports.py
          --format nm
          --tool nm
          build/wrapper-contract/libllamadart.so
      # The release archives get the same check from
      # validate_linux_artifact.py.
      - name: Check that no library registers static destructors with the C library
        run: |
          for library in build/wrapper-contract/libllamadart.so build/wrapper-contract/bin/*.so; do
            python3 tools/validate_exports.py --format readelf --tool readelf \
              --imports-only --forbid-import __cxa_atexit "$library"
          done

  msvc-mtmd-link-contract:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: ${{ matrix.upstream == 'pinned' && 'msvc-mtmd-link-contract' || format('msvc-mtmd-link-contract ({0})', matrix.upstream) }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, post-v0.4.0, v0.6.0]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select candidate upstream
        if: matrix.upstream != 'pinned'
        shell: bash
        env:
          LLAMADART_QUALIFICATION_SHA: ${{ matrix.upstream == 'v0.6.0' && env.LLAMADART_V060_QUALIFICATION_SHA || matrix.upstream == 'v0.5.0' && env.LLAMADART_V050_QUALIFICATION_SHA || env.LLAMADART_QUALIFICATION_SHA }}
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_QUALIFICATION_SHA"
      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      - name: Configure MSVC Release build
        run: >-
          cmake --preset windows-x64-full
          -DGGML_BLAS=OFF
          -DGGML_CCACHE=OFF
          -DGGML_CPU_KLEIDIAI=OFF
          -DGGML_CUDA=OFF
          -DGGML_OPENCL=OFF
          -DGGML_OPENMP=OFF
          -DGGML_VULKAN=OFF
          -DLLAMADART_BUILD_TESTS=ON
      - name: Link mtmd shared library without LTCG objects
        run: cmake --build --preset windows-x64-full --target mtmd
      - name: Validate current mtmd export contract
        shell: pwsh
        run: |
          python tools/validate_exports.py `
            --format dumpbin `
            --tool dumpbin `
            --symbol mtmd_input_chunk_get_placeholder `
            build/wx64/bin/mtmd.dll
      # The release builds the wrapper with this compiler, and the exception
      # barrier depends on how it treats a catch around an extern "C" call.
      - name: Build the wrapper and its barrier tests with MSVC
        run: >-
          cmake --build --preset windows-x64-full --target
          llamadart_barrier_test
          llamadart_exit_teardown_test
          llamadart_vulkan_device_info_test
          llamadart_tts_api_test
          llamadart_image_token_limit_test
      - name: Run the barrier and Vulkan probe tests
        shell: pwsh
        run: |
          $wrapperDir = (Resolve-Path build/wx64).Path
          $upstreamDir = (Resolve-Path build/wx64/bin).Path
          $env:PATH = "$wrapperDir;$upstreamDir;$env:PATH"
          ctest --test-dir build/wx64 -R "barrier|vocabulary|vulkan_device_info|tts_api|image_token_limit" --timeout 120 --output-on-failure
      - name: Validate wrapper exports
        shell: pwsh
        run: |
          python tools/validate_exports.py `
            --format dumpbin `
            --tool dumpbin `
            build/wx64/llamadart.dll

  macos-exit-teardown:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    name: macos-exit-teardown (${{ matrix.build }}, ${{ matrix.upstream }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        upstream: [pinned, v0.6.0]
        build: [release, address-sanitizer]
        include:
          # The shipped configuration: Release with link-time optimization.
          - build: release
            configure: --preset macos-arm64-full
            build_dir: build/macos-arm64-full
          - build: address-sanitizer
            configure: >-
              -S . -B build/exit-teardown-asan -G Ninja
              -DCMAKE_BUILD_TYPE=RelWithDebInfo
              -DGGML_NATIVE=OFF
              -DGGML_OPENMP=OFF
              "-DCMAKE_C_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
              "-DCMAKE_CXX_FLAGS=-fsanitize=address -fno-omit-frame-pointer"
              -DCMAKE_OBJC_FLAGS=-fsanitize=address
              -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address
            build_dir: build/exit-teardown-asan
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Select v0.6.0 candidate upstream
        if: matrix.upstream == 'v0.6.0'
        run: |
          git -C third_party/llama.cpp fetch --depth=1 origin "$LLAMADART_V060_QUALIFICATION_SHA"
          git -C third_party/llama.cpp checkout --detach "$LLAMADART_V060_QUALIFICATION_SHA"
          test "$(git -C third_party/llama.cpp rev-parse HEAD)" = "$LLAMADART_V060_QUALIFICATION_SHA"
      - name: Configure the Metal wrapper with its tests
        run: >-
          cmake ${{ matrix.configure }}
          -DGGML_CCACHE=OFF
          -DLLAMADART_BUILD_TESTS=ON
      - name: Build the exit teardown test
        run: >-
          cmake --build ${{ matrix.build_dir }} --target
          llamadart_exit_teardown_test llamadart_image_token_limit_test
      - name: Validate wrapper exports and the static destructor binding
        run: >-
          python3 tools/validate_exports.py --format nm --tool nm
          --forbid-import __cxa_atexit
          ${{ matrix.build_dir }}/libllamadart.dylib
      # The model scenarios write their own models, so nothing is downloaded.
      # The first scenario that reaches Metal waits for the runner to compile
      # the Metal library, which takes most of a minute.
      - name: Run the exit teardown scenarios
        run: >-
          ctest --test-dir ${{ matrix.build_dir }} -R "exit_teardown|image_token_limit"
          --timeout 300 --output-on-failure
      # A model that nothing tracks aborts at exit when Metal residency sets
      # are live. Whether a runner has them is outside this repository's
      # control, so their absence is reported instead of failing every native
      # change. The model-freed scenario shows the frees either way.
      - name: Check whether the Metal abort path was exercised
        run: |
          set +e
          "${{ matrix.build_dir }}/llamadart_exit_teardown_test" \
            model-idle-untracked \
            "${{ matrix.build_dir }}/exit_teardown_test_model.gguf" \
            > untracked-control.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -q 'rsets->data count' untracked-control.log; then
            echo "Metal residency sets: the untracked control aborted in ggml-metal, so the model scenarios exercised the Metal abort path." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$status" -eq 0 ]; then
            echo "::warning title=Metal abort path not exercised::The untracked control exited cleanly, so no Metal residency set was live on this runner. That does not show whether Metal buffers were in use."
            echo "No Metal residency sets: the untracked control exited cleanly, so the Metal abort path was not exercised on this runner. Metal buffers may still have been in use." >> "$GITHUB_STEP_SUMMARY"
          else
            cat untracked-control.log
            echo "The untracked control failed with status $status for another reason."
            exit 1
          fi

  wrapper-validation:
    if: always()
    needs: [changes, android-arm64-isa, android-vulkan-shaders, kleidiai-dispatch-emulated, windows-arm64-kleidiai, windows-arm64-vulkan, linux-artifact-contract, wrapper-contract, msvc-mtmd-link-contract, macos-exit-teardown]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected native lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_scope.py --check-results
