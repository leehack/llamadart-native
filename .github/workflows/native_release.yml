name: Native Build & Release

on:
  workflow_dispatch:
    inputs:
      llama_cpp_tag:
        description: 'llama.cpp ref to build (e.g., b8011, latest, submodule)'
        required: true
        default: 'latest'
      native_release_tag:
        description: 'llamadart-native release tag/archive suffix (blank = resolved llama.cpp tag)'
        required: false
        default: ''
      publish_release:
        description: 'Publish GitHub release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: native-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  CUDA_REDIST_VERSION: 12.8.1
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_CUDA_COMPILER_LAUNCHER: ccache
  VCPKG_CACHE_VERSION: v1

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      llama_cpp_ref: ${{ steps.tag.outputs.tag }}
      llama_cpp_commit: ${{ steps.llama-checkout.outputs.commit }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve llama.cpp tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.llama_cpp_tag }}"

          if [ -z "$TAG" ] || [ "$TAG" = "latest" ]; then
            TAG=$(gh api repos/ggml-org/llama.cpp/releases/latest --jq '.tag_name')
          elif [ "$TAG" = "submodule" ]; then
            TAG=$(git -C third_party/llama.cpp describe --tags --exact-match 2>/dev/null || git -C third_party/llama.cpp rev-parse --short HEAD)
          fi

          RELEASE_TAG="${{ github.event.inputs.native_release_tag }}"
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="$TAG"
          fi
          if [ "$RELEASE_TAG" = "cuda-prebuilt-experiment" ] && [ "${{ github.event.inputs.publish_release }}" != "false" ]; then
            echo "cuda-prebuilt-experiment is strictly non-publishing." >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid native_release_tag: $RELEASE_TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved llama.cpp tag: $TAG"
          echo "Resolved native release tag: $RELEASE_TAG"

          if [ "${{ github.event.inputs.publish_release }}" = "true" ]; then
            git fetch --tags --force origin

            existing_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
            if [ -n "$existing_sha" ]; then
              echo "Release tag $RELEASE_TAG already exists at $existing_sha." >&2
              echo "Use a new native_release_tag for wrapper-only rebuilds, for example ${TAG}-llamadart.1." >&2
              exit 1
            fi

            set +e
            release_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.html_url' 2>&1)"
            release_status=$?
            set -e
            if [ "$release_status" -eq 0 ]; then
              echo "GitHub release $RELEASE_TAG already exists at $release_url." >&2
              echo "Use a new native_release_tag for wrapper-only rebuilds, for example ${TAG}-llamadart.1." >&2
              exit 1
            fi
            if ! grep -q "HTTP 404" <<< "$release_url"; then
              echo "Unable to verify whether GitHub release $RELEASE_TAG already exists:" >&2
              echo "$release_url" >&2
              exit 1
            fi
          fi

      - name: Resolve exact llama.cpp commit
        id: llama-checkout
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ steps.tag.outputs.tag }}
          github_token: ${{ github.token }}

  build-android:
    needs: resolve-tag
    if: ${{ github.event.inputs.native_release_tag != 'cuda-prebuilt-experiment' }}
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: arm64-v8a
            out_arch: arm64
            backend: vulkan
            include_core: true
            backend_glob: libggml-vulkan.so
          - android_abi: arm64-v8a
            out_arch: arm64
            backend: opencl
            include_core: false
            backend_glob: libggml-opencl.so
          - android_abi: x86_64
            out_arch: x64
            backend: vulkan
            include_core: true
            backend_glob: libggml-vulkan.so
          - android_abi: x86_64
            out_arch: x64
            backend: opencl
            include_core: false
            backend_glob: libggml-opencl.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}
      - name: Select pinned Android NDK
        run: |
          set -euo pipefail
          ANDROID_SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$ANDROID_SDK_DIR/ndk/${ANDROID_NDK_VERSION}"
          test -d "$NDK_DIR" || { echo "Missing $NDK_DIR" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using pinned Android NDK: $NDK_DIR"
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ matrix.android_abi }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ matrix.android_abi }}-${{ matrix.backend }}-
            ccache-android-${{ matrix.android_abi }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py android --abi ${{ matrix.android_abi }} --backend ${{ matrix.backend }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (android/${{ matrix.android_abi }}/${{ matrix.backend }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Android backend artifacts
        run: |
          set -euo pipefail

          OUT_DIR="bin/android/${{ matrix.out_arch }}"
          test -f "$OUT_DIR/${{ matrix.backend_glob }}" || { echo "Missing $OUT_DIR/${{ matrix.backend_glob }}"; exit 1; }

          READELF="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf -print -quit)"
          if [ -z "$READELF" ]; then
            echo "Unable to locate llvm-readelf in ANDROID_NDK_HOME" >&2
            exit 1
          fi

          python3 tools/validate_android_artifacts.py --readelf "$READELF" "$OUT_DIR"

          if [ "${{ matrix.include_core }}" = "true" ]; then
            test -f "$OUT_DIR/libllamadart.so" || { echo "Missing $OUT_DIR/libllamadart.so"; exit 1; }
            test -f "$OUT_DIR/libllama-common.so" || { echo "Missing $OUT_DIR/libllama-common.so"; exit 1; }
            python3 tools/validate_exports.py \
              --format readelf \
              --tool "$READELF" \
              "$OUT_DIR/libllamadart.so"
          fi

          if [ "${{ matrix.android_abi }}" = "arm64-v8a" ]; then
            OBJDUMP="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-objdump -print -quit)"
            if [ -z "$OBJDUMP" ]; then
              echo "Unable to locate llvm-objdump in ANDROID_NDK_HOME" >&2
              exit 1
            fi

            ARMV82_LIB="$OUT_DIR/libggml-cpu-android_armv8.2_2.so"
            test -f "$ARMV82_LIB" || { echo "Missing $ARMV82_LIB"; exit 1; }
            ARMV82_DISASM="$(mktemp)"
            SCORE_SYMS_FILE="$(mktemp)"
            trap 'rm -f "${DISASM_FILE:-}" "${ARMV82_DISASM:-}" "${SCORE_SYMS_FILE:-}"' EXIT
            "$OBJDUMP" -d --no-show-raw-insn "$ARMV82_LIB" > "$ARMV82_DISASM"
            if grep -Eq '\b(addvl|ptrue|cntw|rdvl|ld1b|st1b)\b' "$ARMV82_DISASM"; then
              echo "Found unexpected SVE instructions in $ARMV82_LIB" >&2
              exit 1
            fi

            if [ "${{ matrix.include_core }}" = "true" ]; then
              expected_cpu_variants=(
                "libggml-cpu-android_armv8.0_1.so"
                "libggml-cpu-android_armv8.2_1.so"
                "libggml-cpu-android_armv8.2_2.so"
                "libggml-cpu-android_armv8.6_1.so"
                "libggml-cpu-android_armv9.0_1.so"
                "libggml-cpu-android_armv9.2_1.so"
                "libggml-cpu-android_armv9.2_2.so"
              )
              for lib in "${expected_cpu_variants[@]}"; do
                test -f "$OUT_DIR/$lib" || { echo "Missing $OUT_DIR/$lib"; exit 1; }
                "$READELF" -Ws "$OUT_DIR/$lib" > "$SCORE_SYMS_FILE"
                if ! grep -Fq 'ggml_backend_score' "$SCORE_SYMS_FILE"; then
                  grep 'ggml_backend' "$SCORE_SYMS_FILE" || true
                  echo "Missing ggml_backend_score export in $OUT_DIR/$lib" >&2
                  exit 1
                fi
              done
            fi

            CPU_LIB="$OUT_DIR/libggml-cpu-android_armv8.0_1.so"
            if [ ! -f "$CPU_LIB" ]; then
              CPU_LIB="$OUT_DIR/libggml-cpu.so"
            fi
            test -f "$CPU_LIB" || { echo "Missing $CPU_LIB"; exit 1; }

            DISASM_FILE="$(mktemp)"
            "$OBJDUMP" -d "$CPU_LIB" > "$DISASM_FILE"

            if grep -Eiq 'stlurh?|stlurb' "$DISASM_FILE"; then
              echo "Found unsupported armv8.4-a LRCPC2 STLUR instructions in $CPU_LIB" >&2
              exit 1
            fi
          fi
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/android/${{ matrix.out_arch }}"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          if [ "${{ matrix.include_core }}" = "true" ]; then
            cp "$OUT_DIR"/*.so "$PAYLOAD"/
          else
            cp "$OUT_DIR/${{ matrix.backend_glob }}" "$PAYLOAD"/
          fi
          ls -la "$PAYLOAD"
          test -n "$(find "$PAYLOAD" -maxdepth 1 -type f -print -quit)"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native_android_${{ matrix.android_abi }}_${{ matrix.backend }}
          path: artifact_payload/*

  build-apple:
    needs: resolve-tag
    if: ${{ github.event.inputs.native_release_tag != 'cuda-prebuilt-experiment' }}
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            out_dir: macos/arm64
          - target: macos-x86_64
            out_dir: macos/x86_64
          - target: ios-device-arm64
            out_dir: ios/arm64
          - target: ios-sim-arm64
            out_dir: ios/arm64-sim
          - target: ios-sim-x86_64
            out_dir: ios/x86_64-sim
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: brew install ccache
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-apple-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-apple-${{ matrix.target }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py apple --target ${{ matrix.target }}
      - name: Validate Apple wrapper exports
        run: |
          OUT_LIB="bin/${{ matrix.out_dir }}/libllamadart.dylib"
          test -f "$OUT_LIB" || { echo "Missing $OUT_LIB"; exit 1; }
          python3 tools/validate_exports.py --format nm --tool nm "$OUT_LIB"
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (apple/${{ matrix.target }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native_apple_${{ matrix.target }}
          path: bin/${{ matrix.out_dir }}/*

  build-linux:
    needs: resolve-tag
    if: ${{ github.event.inputs.native_release_tag != 'cuda-prebuilt-experiment' }}
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            backend: vulkan
            include_core: true
            needs_vulkan: true
            needs_openblas: false
            needs_cuda: false
            backend_glob: libggml-vulkan.so
          - arch: x64
            backend: cuda
            include_core: false
            needs_vulkan: false
            needs_openblas: false
            needs_cuda: true
            backend_glob: libggml-cuda.so
          - arch: x64
            backend: blas
            include_core: false
            needs_vulkan: false
            needs_openblas: true
            needs_cuda: false
            backend_glob: libggml-blas.so
          - arch: arm64
            backend: vulkan
            include_core: true
            needs_vulkan: true
            needs_openblas: false
            needs_cuda: false
            backend_glob: libggml-vulkan.so
          - arch: arm64
            backend: blas
            include_core: false
            needs_vulkan: false
            needs_openblas: true
            needs_cuda: false
            backend_glob: libggml-blas.so
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: |
          apt_get_update() {
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install() {
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            source /etc/os-release
            CODENAME="${VERSION_CODENAME}"
            {
              printf '%s\n' \
                "Types: deb" \
                "URIs: http://archive.ubuntu.com/ubuntu" \
                "Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports" \
                "Components: main universe restricted multiverse" \
                "Architectures: amd64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
                "" \
                "Types: deb" \
                "URIs: http://security.ubuntu.com/ubuntu" \
                "Suites: ${CODENAME}-security" \
                "Components: main universe restricted multiverse" \
                "Architectures: amd64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
                "" \
                "Types: deb" \
                "URIs: http://ports.ubuntu.com/ubuntu-ports" \
                "Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports ${CODENAME}-security" \
                "Components: main universe restricted multiverse" \
                "Architectures: arm64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg"
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          apt_get_update
          apt_get_install ccache ninja-build pkg-config make
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            apt_get_install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          fi
          if [ "${{ matrix.needs_vulkan }}" = "true" ]; then
            apt_get_install libvulkan-dev glslc
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              apt_get_install libvulkan-dev:arm64
            fi
          fi
          if [ "${{ matrix.needs_openblas }}" = "true" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              apt_get_install libopenblas-dev:arm64
            else
              apt_get_install libopenblas-dev
            fi
          fi
          if [ "${{ matrix.needs_cuda }}" = "true" ]; then
            cuda_root="${RUNNER_TEMP}/cuda-${CUDA_REDIST_VERSION}"
            python3 tools/install_cuda_redist.py \
              --version "${CUDA_REDIST_VERSION}" \
              --platform linux-x86_64 \
              --destination "${cuda_root}"
            test -f "${cuda_root}/lib64/libcudadevrt.a" || { echo "Missing CUDA device runtime static library" >&2; exit 1; }
            test -f "${cuda_root}/lib64/libcudart_static.a" || { echo "Missing CUDA runtime static library" >&2; exit 1; }
            {
              echo "${cuda_root}/bin"
              echo "${cuda_root}/nvvm/bin"
            } >> "${GITHUB_PATH}"
            {
              echo "CUDA_PATH=${cuda_root}"
              echo "CUDAToolkit_ROOT=${cuda_root}"
              echo "LD_LIBRARY_PATH=${cuda_root}/lib64:${cuda_root}/lib64/stubs:${cuda_root}/lib:${cuda_root}/lib/stubs:${LD_LIBRARY_PATH:-}"
            } >> "${GITHUB_ENV}"
            "${cuda_root}/bin/nvcc" --version | tee nvcc-version.txt
            grep -q 'release 12\.8' nvcc-version.txt || {
              echo "Expected CUDA ${CUDA_REDIST_VERSION} nvcc" >&2
              exit 1
            }
          fi
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ matrix.arch }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ matrix.backend }}-
            ccache-linux-${{ matrix.arch }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py linux --arch "${{ matrix.arch }}" --backend "${{ matrix.backend }}"
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (linux/${{ matrix.arch }}/${{ matrix.backend }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Linux backend artifacts
        run: |
          OUT_DIR="bin/linux/${{ matrix.arch }}"
          test -f "$OUT_DIR/${{ matrix.backend_glob }}" || { echo "Missing $OUT_DIR/${{ matrix.backend_glob }}"; exit 1; }
          if [ "${{ matrix.include_core }}" = "true" ]; then
            test -f "$OUT_DIR/libllamadart.so" || { echo "Missing $OUT_DIR/libllamadart.so"; exit 1; }
            python3 tools/validate_exports.py \
              --format readelf \
              --tool readelf \
              "$OUT_DIR/libllamadart.so"
          fi
          for lib in "$OUT_DIR"/*.so; do
            readelf -d "$lib" | grep -E 'Library runpath: \[\$ORIGIN(:|\])' >/dev/null || {
              echo "Expected RUNPATH to start with \$ORIGIN in $lib" >&2
              readelf -d "$lib" | grep -F 'RUNPATH' >&2 || true
              exit 1
            }
          done
          if [ "${{ matrix.needs_cuda }}" = "true" ]; then
            CACHE_FILE="build/linux-x64-full/CMakeCache.txt"
            test -f "$CACHE_FILE" || { echo "Missing CMake cache at $CACHE_FILE"; exit 1; }
            grep -R \
              --include='CMakeCache.txt' \
              --include='*.ninja' \
              --include='*.vcxproj' \
              -E '120a-real|compute_120a|sm_120a' build/linux-x64-full >/dev/null || \
              strings "$OUT_DIR/${{ matrix.backend_glob }}" | grep -E 'compute_120a|sm_120a' >/dev/null || {
              echo "Expected CUDA Blackwell architecture marker in linux CUDA build" >&2
              exit 1
            }
            ldd "$OUT_DIR/${{ matrix.backend_glob }}" | tee ldd-cuda.txt
            missing_deps="$(awk '/not found/ { print $1 }' ldd-cuda.txt || true)"
            unexpected_missing=0
            for dep in $missing_deps; do
              if [ "$dep" = "libcuda.so.1" ]; then
                continue
              fi
              case "$dep" in
                libggml*.so.*|libllama.so.*|libmtmd.so.*)
                  canonical="${dep%%.so.*}.so"
                  if [ -f "$OUT_DIR/$canonical" ]; then
                    continue
                  fi
                  ;;
              esac
              echo "Unexpected unresolved shared library dependency: $dep" >&2
              unexpected_missing=1
            done
            if [ "$unexpected_missing" -ne 0 ]; then
              exit 1
            fi
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            CACHE_FILE="build/linux-arm64-full/CMakeCache.txt"
            test -f "$CACHE_FILE" || { echo "Missing CMake cache at $CACHE_FILE"; exit 1; }
            grep -q '^GGML_CPU_KLEIDIAI:BOOL=ON$' "$CACHE_FILE" || { echo "Kleidi is not enabled in arm64 build"; exit 1; }
          fi
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/linux/${{ matrix.arch }}"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          shopt -s nullglob
          if [ "${{ matrix.include_core }}" = "true" ]; then
            files=("$OUT_DIR"/*.so)
          else
            files=("$OUT_DIR"/${{ matrix.backend_glob }})
          fi
          [ "${#files[@]}" -gt 0 ] || { echo "No files staged for upload"; exit 1; }
          cp "${files[@]}" "$PAYLOAD"/
          ls -la "$PAYLOAD"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native_linux_${{ matrix.arch }}_${{ matrix.backend }}
          path: artifact_payload/*

  build-linux-hip:
    needs: resolve-tag
    if: ${{ github.event.inputs.native_release_tag != 'cuda-prebuilt-experiment' }}
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.1.2
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Install Git
        run: |
          apt_get_update() {
            for attempt in 1 2 3; do
              if apt-get -o Acquire::Retries=3 update; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install() {
            for attempt in 1 2 3; do
              if DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_update
          apt_get_install git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: |
          apt_get_install() {
            for attempt in 1 2 3; do
              if DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install build-essential binutils ccache ninja-build pkg-config python3 python3-pip rocblas-dev hipblas-dev
          python3 -m pip install --upgrade cmake
          cmake --version
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-x64-hip-${{ github.run_id }}
          restore-keys: |
            ccache-linux-x64-hip-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py linux --arch x64 --backend hip
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (linux/x64/hip)"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Linux HIP artifacts
        run: |
          OUT_DIR="bin/linux/x64"
          test -f "$OUT_DIR/libggml-hip.so" || { echo "Missing $OUT_DIR/libggml-hip.so"; exit 1; }
          for lib in "$OUT_DIR"/*.so; do
            readelf -d "$lib" | grep -E 'Library runpath: \[\$ORIGIN(:|\])' >/dev/null || {
              echo "Expected RUNPATH to start with \$ORIGIN in $lib" >&2
              readelf -d "$lib" | grep -F 'RUNPATH' >&2 || true
              exit 1
            }
          done
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/linux/x64"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          cp "$OUT_DIR/libggml-hip.so" "$PAYLOAD"/
          ls -la "$PAYLOAD"
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native_linux_x64_hip
          path: artifact_payload/*

  build-windows:
    needs: resolve-tag
    if: ${{ github.event.inputs.native_release_tag != 'cuda-prebuilt-experiment' }}
    runs-on: ${{ matrix.runs_on }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-latest
            backend: vulkan
            include_core: true
            needs_cuda: false
            needs_openblas: false
            needs_vulkan: true
            backend_glob: "*ggml-vulkan*.dll"
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-2022
            backend: cuda
            include_core: false
            needs_cuda: true
            needs_openblas: false
            needs_vulkan: false
            backend_glob: "*ggml-cuda*.dll"
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-latest
            backend: blas
            include_core: false
            needs_cuda: false
            needs_openblas: true
            needs_vulkan: false
            backend_glob: "*ggml-blas*.dll"
          - arch: arm64
            vcpkg_triplet: arm64-windows
            runs_on: windows-11-arm
            backend: vulkan
            include_core: true
            needs_cuda: false
            needs_openblas: false
            needs_vulkan: true
            backend_glob: "*ggml-vulkan*.dll"
          - arch: arm64
            vcpkg_triplet: arm64-windows
            runs_on: windows-11-arm
            backend: blas
            include_core: false
            needs_cuda: false
            needs_openblas: true
            needs_vulkan: false
            backend_glob: "*ggml-blas*.dll"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Enable Git Long Paths
        run: git config --global core.longpaths true
      - name: Setup MSVC (x64)
        if: ${{ matrix.arch == 'x64' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Setup MSVC (arm64 cross)
        if: ${{ matrix.arch == 'arm64' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install Ninja
        if: ${{ matrix.arch == 'x64' }}
        run: choco install ninja -y
      - name: Install CUDA Toolkit
        if: ${{ matrix.needs_cuda }}
        run: |
          $cudaRoot = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          python tools/install_cuda_redist.py `
            --version "${env:CUDA_REDIST_VERSION}" `
            --platform windows-x86_64 `
            --destination "$cudaRoot"
          Add-Content $env:GITHUB_PATH (Join-Path $cudaRoot "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $cudaRoot "nvvm\bin")
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cudaRoot"
          Add-Content $env:GITHUB_ENV "CUDAToolkit_ROOT=$cudaRoot"
          $nvccVersion = & (Join-Path $cudaRoot "bin\nvcc.exe") --version
          $nvccVersion
          if (($nvccVersion -join "`n") -notmatch 'release 12\.8') {
            throw "Expected CUDA ${env:CUDA_REDIST_VERSION} nvcc"
          }
      - name: Restore vcpkg cache
        if: ${{ matrix.needs_openblas }}
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_CACHE_VERSION }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
      - name: Install OpenBLAS (vcpkg)
        if: ${{ matrix.needs_openblas }}
        run: |
          $vcpkgRoot = "C:\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg "$vcpkgRoot"
          }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          $openblasLib = Join-Path $vcpkgRoot "installed\${{ matrix.vcpkg_triplet }}\lib\openblas.lib"
          if (-not (Test-Path $openblasLib)) {
            & "$vcpkgRoot\vcpkg.exe" install "openblas:${{ matrix.vcpkg_triplet }}"
          } else {
            Write-Host "OpenBLAS already present in cache: $openblasLib"
          }

          $pkgconfCandidates = @(
            (Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkg-config.exe"),
            (Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkgconf.exe")
          )
          $pkgconf = $pkgconfCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pkgconf) {
            & "$vcpkgRoot\vcpkg.exe" install "pkgconf:x64-windows"
            $pkgconf = $pkgconfCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $pkgconf) {
            throw "pkg-config executable not found in vcpkg tools"
          }
          Add-Content $env:GITHUB_PATH (Split-Path $pkgconf -Parent)
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_EXECUTABLE=$pkgconf"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkgRoot"
      - name: Setup sccache
        if: ${{ matrix.arch == 'x64' }}
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure sccache
        if: ${{ matrix.arch == 'x64' }}
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
      - name: Disable sccache for arm64 Visual Studio builds
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          Add-Content $env:GITHUB_ENV "CMAKE_C_COMPILER_LAUNCHER="
          Add-Content $env:GITHUB_ENV "CMAKE_CXX_COMPILER_LAUNCHER="
      - name: Install Vulkan SDK
        if: ${{ matrix.needs_vulkan }}
        run: |
          $ver = "1.4.313.2"
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"
      - name: Build
        run: python tools/build.py windows --arch ${{ matrix.arch }} --backend ${{ matrix.backend }}
      - name: Validate Windows backend artifacts
        run: |
          $out = "bin/windows/${{ matrix.arch }}"
          if (-not (Get-ChildItem $out -Filter "${{ matrix.backend_glob }}" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
            throw "Missing backend DLL '${{ matrix.backend_glob }}' in $out"
          }
          if ("${{ matrix.backend }}" -eq "cuda") {
            if (-not (Get-ChildItem $out -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cudart64_*.dll) in $out"
            }
            if (-not (Get-ChildItem $out -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cublas64_*.dll) in $out"
            }
            if (-not (Get-ChildItem $out -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cublasLt64_*.dll) in $out"
            }
            $cache = "build/wx64/CMakeCache.txt"
            if (-not (Test-Path $cache)) {
              throw "Missing CMake cache at $cache"
            }
            $cudaArchFiles = Get-ChildItem "build/wx64" -Recurse -File -Include CMakeCache.txt,*.ninja,*.vcxproj
            if (-not ($cudaArchFiles | Select-String -Pattern "120a-real|compute_120a|sm_120a" -Quiet)) {
              throw "Expected CUDA Blackwell architecture marker in windows CUDA build"
            }
            $cudaBin = Join-Path $env:CUDA_PATH "bin"
            $cudaDlls = @()
            $cudaDlls += Get-ChildItem $out -Filter "cudart64_*.dll"
            $cudaDlls += Get-ChildItem $out -Filter "cublas64_*.dll"
            $cudaDlls += Get-ChildItem $out -Filter "cublasLt64_*.dll"
            foreach ($dll in $cudaDlls) {
              $source = Join-Path $cudaBin $dll.Name
              if (-not (Test-Path $source)) {
                throw "Packaged CUDA DLL $($dll.Name) is not present in CUDA_PATH"
              }
              $packagedHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
              $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
              if ($packagedHash -ne $sourceHash) {
                throw "Packaged CUDA DLL $($dll.Name) does not match CUDA_PATH"
              }
            }
          }
          if ("${{ matrix.backend }}" -eq "blas") {
            if (-not (Get-ChildItem $out -Filter "openblas*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing BLAS runtime dependency (openblas*.dll) in $out"
            }
          }
          if ("${{ matrix.include_core }}" -eq "true") {
            $wrapper = Get-ChildItem $out -Filter "*llamadart*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wrapper) {
              throw "Missing core wrapper DLL in $out"
            }
            python tools/validate_exports.py --format dumpbin --tool dumpbin $wrapper.FullName
          }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $cache = "build/wa64/CMakeCache.txt"
            if (-not (Test-Path $cache)) {
              throw "Missing CMake cache at $cache"
            }
            if (-not (Select-String -Path $cache -Pattern '^GGML_CPU_KLEIDIAI:BOOL=ON$' -Quiet)) {
              throw "Kleidi is not enabled in windows arm64 build"
            }
          }
      - name: Stage upload payload
        run: |
          $out = "bin/windows/${{ matrix.arch }}"
          $payload = "artifact_payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          if ("${{ matrix.include_core }}" -eq "true") {
            $files = Get-ChildItem $out -Filter "*.dll" -ErrorAction Stop
          } else {
            $files = @(
              Get-ChildItem $out -Filter "${{ matrix.backend_glob }}" -ErrorAction Stop
            )
            if ("${{ matrix.backend }}" -eq "cuda") {
              $files += Get-ChildItem $out -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue
              $files += Get-ChildItem $out -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue
              $files += Get-ChildItem $out -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue
            }
            if ("${{ matrix.backend }}" -eq "blas") {
              $files += Get-ChildItem $out -Filter "openblas*.dll" -ErrorAction SilentlyContinue
            }
            $files = $files | Sort-Object FullName -Unique
          }
          if (-not $files) {
            throw "No files staged for upload"
          }
          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $payload -Force
          }
          Get-ChildItem $payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: native_windows_${{ matrix.arch }}_${{ matrix.backend }}
          path: artifact_payload/*
      - name: Save vcpkg cache
        if: ${{ always() && matrix.needs_openblas && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_CACHE_VERSION }}

  windows-cuda-prebuilt-experiment:
    needs: resolve-tag
    if: >-
      ${{ github.event.inputs.native_release_tag == 'cuda-prebuilt-experiment' &&
          github.event.inputs.publish_release == 'false' }}
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      LLAMA_CPP_TAG: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
      LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
      CUDA_CUOBJDUMP_VERSION: '13.3.29'
      CUDA_CUOBJDUMP_ARCHIVE_SHA256: '50c8ab72fdfec7e5958fbd61988719460093d7ac86e2893377e77c8d908a2350'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify packaging unit contracts
        run: python -m unittest discover -s tools/tests -v

      - name: Install exact GPU-less fatbin inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archiveName = "cuda_cuobjdump-windows-x86_64-$env:CUDA_CUOBJDUMP_VERSION-archive.zip"
          $archive = Join-Path $env:RUNNER_TEMP $archiveName
          $url = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cuobjdump/windows-x86_64/$archiveName"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CUDA_CUOBJDUMP_ARCHIVE_SHA256) {
            throw "NVIDIA cuobjdump archive digest mismatch: expected $env:CUDA_CUOBJDUMP_ARCHIVE_SHA256, got $actual"
          }
          $destination = Join-Path $env:RUNNER_TEMP 'cuda-cuobjdump'
          Expand-Archive -Path $archive -DestinationPath $destination
          $tools = @(Get-ChildItem $destination -Recurse -File -Filter 'cuobjdump.exe')
          if ($tools.Count -ne 1) {
            throw "Expected exactly one cuobjdump.exe, found $($tools.Count)"
          }
          & $tools[0].FullName --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned cuobjdump executable failed its version probe'
          }
          "CUDA_CUOBJDUMP=$($tools[0].FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve and download exact release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $downloadDir = Join-Path $env:RUNNER_TEMP 'cuda-prebuilt-downloads'
          New-Item -ItemType Directory -Force -Path $downloadDir | Out-Null

          $upstreamRelease = gh api "repos/ggml-org/llama.cpp/releases/tags/$env:LLAMA_CPP_TAG" |
            ConvertFrom-Json
          if ($upstreamRelease.target_commitish -ne $env:LLAMA_CPP_COMMIT) {
            throw "Upstream release target $($upstreamRelease.target_commitish) does not match resolved commit $env:LLAMA_CPP_COMMIT"
          }

          $nativeTagTree = git ls-tree "refs/tags/$env:LLAMA_CPP_TAG" third_party/llama.cpp
          if (-not $nativeTagTree) {
            throw "Native release tag $env:LLAMA_CPP_TAG does not record third_party/llama.cpp"
          }
          $nativeTagLlamaCommit = ($nativeTagTree -split '\s+')[2]
          if ($nativeTagLlamaCommit -ne $env:LLAMA_CPP_COMMIT) {
            throw "Native release tag records llama.cpp $nativeTagLlamaCommit, expected $env:LLAMA_CPP_COMMIT"
          }

          $nativeRelease = gh api "repos/leehack/llamadart-native/releases/tags/$env:LLAMA_CPP_TAG" |
            ConvertFrom-Json
          $coreName = "llamadart-native-windows-x64-$env:LLAMA_CPP_TAG.tar.gz"
          $assetNames = @(
            $coreName,
            "llama-$env:LLAMA_CPP_TAG-bin-win-cuda-12.4-x64.zip",
            'cudart-llama-bin-win-cuda-12.4-x64.zip',
            "llama-$env:LLAMA_CPP_TAG-bin-win-cuda-13.3-x64.zip",
            'cudart-llama-bin-win-cuda-13.3-x64.zip'
          )

          $metadata = @{}
          foreach ($assetName in $assetNames) {
            $release = if ($assetName -eq $coreName) { $nativeRelease } else { $upstreamRelease }
            $asset = $release.assets | Where-Object name -EQ $assetName | Select-Object -First 1
            if (-not $asset) {
              throw "Required release asset is missing: $assetName"
            }
            if ($asset.digest -notmatch '^sha256:[0-9a-f]{64}$') {
              throw "Release asset has no usable SHA-256 digest: $assetName"
            }
            $metadata[$assetName] = $asset.digest.Substring(7)
            $repository = if ($assetName -eq $coreName) {
              'leehack/llamadart-native'
            } else {
              'ggml-org/llama.cpp'
            }
            gh release download $env:LLAMA_CPP_TAG `
              --repo $repository `
              --pattern $assetName `
              --dir $downloadDir
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to download $repository release asset $assetName"
            }
            $path = Join-Path $downloadDir $assetName
            $actual = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $metadata[$assetName]) {
              throw "Downloaded asset digest mismatch for $assetName"
            }
          }

          $metadata | ConvertTo-Json | Set-Content `
            (Join-Path $downloadDir 'release-assets.json')
          "CUDA_PREBUILT_DOWNLOAD_DIR=$downloadDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Extract exact native core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $coreDir = Join-Path $env:RUNNER_TEMP 'native-core'
          New-Item -ItemType Directory -Force -Path $coreDir | Out-Null
          $archive = Join-Path $env:CUDA_PREBUILT_DOWNLOAD_DIR `
            "llamadart-native-windows-x64-$env:LLAMA_CPP_TAG.tar.gz"
          tar -xzf $archive -C $coreDir
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to extract exact native core bundle'
          }
          foreach ($name in @('ggml-base.dll', 'ggml.dll')) {
            if (-not (Test-Path (Join-Path $coreDir $name))) {
              throw "Native core bundle is missing $name"
            }
          }
          "CUDA_PREBUILT_CORE_DIR=$coreDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package CUDA 12.4 and CUDA 13.3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $outputDir = Join-Path $env:RUNNER_TEMP 'cuda-packs'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          $metadata = Get-Content `
            (Join-Path $env:CUDA_PREBUILT_DOWNLOAD_DIR 'release-assets.json') |
            ConvertFrom-Json -AsHashtable
          $core = Join-Path $env:CUDA_PREBUILT_CORE_DIR 'ggml-base.dll'
          $timer = [Diagnostics.Stopwatch]::StartNew()

          foreach ($version in @('12.4', '13.3')) {
            $backendName = "llama-$env:LLAMA_CPP_TAG-bin-win-cuda-$version-x64.zip"
            $runtimeName = "cudart-llama-bin-win-cuda-$version-x64.zip"
            python tools/package_upstream_cuda.py `
              --tag $env:LLAMA_CPP_TAG `
              --llama-commit $env:LLAMA_CPP_COMMIT `
              --cuda-version $version `
              --backend-archive (Join-Path $env:CUDA_PREBUILT_DOWNLOAD_DIR $backendName) `
              --backend-sha256 $metadata[$backendName] `
              --runtime-archive (Join-Path $env:CUDA_PREBUILT_DOWNLOAD_DIR $runtimeName) `
              --runtime-sha256 $metadata[$runtimeName] `
              --core-dll $core `
              --cuobjdump $env:CUDA_CUOBJDUMP `
              --output-dir $outputDir
            if ($LASTEXITCODE -ne 0) {
              throw "CUDA $version packaging failed"
            }
          }
          $timer.Stop()
          "CUDA_PREBUILT_OUTPUT_DIR=$outputDir" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CUDA pack preparation: $([math]::Round($timer.Elapsed.TotalSeconds, 1)) seconds" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Independently verify finished CUDA packs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/verify_cuda_pack.py `
            --pack (Join-Path $env:CUDA_PREBUILT_OUTPUT_DIR `
              "llamadart-native-windows-x64-cuda12-$env:LLAMA_CPP_TAG.tar.gz") `
            --pack (Join-Path $env:CUDA_PREBUILT_OUTPUT_DIR `
              "llamadart-native-windows-x64-cuda13-$env:LLAMA_CPP_TAG.tar.gz") `
            --expected-tag $env:LLAMA_CPP_TAG `
            --expected-commit $env:LLAMA_CPP_COMMIT
          if ($LASTEXITCODE -ne 0) {
            throw 'Finished CUDA pack verification failed'
          }

      - name: Smoke renamed CUDA backends through ggml loader
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($major in @('12', '13')) {
            $smokeDir = Join-Path $env:RUNNER_TEMP "cuda-smoke-$major"
            New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
            $pack = Join-Path $env:CUDA_PREBUILT_OUTPUT_DIR `
              "llamadart-native-windows-x64-cuda$major-$env:LLAMA_CPP_TAG.tar.gz"
            tar -xzf $pack -C $smokeDir
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to extract CUDA $major pack"
            }
            foreach ($name in @('ggml-base.dll', 'ggml.dll', 'vcomp140.dll')) {
              $source = Join-Path $env:CUDA_PREBUILT_CORE_DIR $name
              if (Test-Path $source) {
                Copy-Item $source $smokeDir
              }
            }
            $smokeArgs = @(
              'tools/smoke_windows_cuda_pack.py',
              '--directory', $smokeDir,
              '--backend', "ggml-cuda-$major.dll"
            )
            if ($major -eq '12') {
              $smokeArgs += '--allow-missing-nvidia-driver'
            }
            python @smokeArgs
            if ($LASTEXITCODE -ne 0) {
              throw "CUDA $major loader smoke failed"
            }
          }

      - name: Record pack checksums
        shell: pwsh
        run: |
          Get-ChildItem $env:CUDA_PREBUILT_OUTPUT_DIR -Filter '*.tar.gz' |
            Sort-Object Name |
            ForEach-Object {
              $digest = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$digest  $($_.Name)"
            } | Set-Content (Join-Path $env:CUDA_PREBUILT_OUTPUT_DIR 'SHA256SUMS')
          Get-Content (Join-Path $env:CUDA_PREBUILT_OUTPUT_DIR 'SHA256SUMS') |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload non-publishing CUDA packs
        uses: actions/upload-artifact@v4
        with:
          name: windows-cuda-prebuilt-${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          path: ${{ runner.temp }}/cuda-packs/*
          compression-level: 0
          retention-days: 7

  package-and-release:
    needs: [resolve-tag, build-android, build-apple, build-linux, build-linux-hip, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Create release provenance commit
        id: provenance
        env:
          LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          LLAMA_CPP_REF: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
        run: |
          set -euo pipefail

          actual_commit="$(git -C third_party/llama.cpp rev-parse HEAD)"
          if [ "$actual_commit" != "$LLAMA_CPP_COMMIT" ]; then
            echo "llama.cpp provenance mismatch: expected $LLAMA_CPP_COMMIT, checked out $actual_commit" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/llama.cpp
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin llama.cpp provenance for $LLAMA_CPP_REF"
          fi

          native_commit="$(git rev-parse HEAD)"
          tree_commit="$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')"
          if [ "$tree_commit" != "$LLAMA_CPP_COMMIT" ]; then
            echo "Release commit $native_commit records llama.cpp $tree_commit, expected $LLAMA_CPP_COMMIT" >&2
            exit 1
          fi

          echo "native_commit=$native_commit" >> "$GITHUB_OUTPUT"
          echo "Release provenance commit: $native_commit"
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          mkdir -p bundles

          for dir in artifacts/native_*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"

            bundle=""
            if [[ "$name" =~ ^native_windows_(x64|arm64)(_.+)?$ ]]; then
              bundle="windows-${BASH_REMATCH[1]}"
            elif [[ "$name" =~ ^native_linux_(x64|arm64)(_.+)?$ ]]; then
              bundle="linux-${BASH_REMATCH[1]}"
            elif [[ "$name" =~ ^native_android_(arm64-v8a|x86_64)(_.+)?$ ]]; then
              if [ "${BASH_REMATCH[1]}" = "arm64-v8a" ]; then
                bundle="android-arm64"
              else
                bundle="android-x64"
              fi
            elif [[ "$name" = "native_apple_macos-arm64" ]]; then
              bundle="macos-arm64"
            elif [[ "$name" = "native_apple_macos-x86_64" ]]; then
              bundle="macos-x86_64"
            elif [[ "$name" = "native_apple_ios-device-arm64" ]]; then
              bundle="ios-arm64"
            elif [[ "$name" = "native_apple_ios-sim-arm64" ]]; then
              bundle="ios-arm64-sim"
            elif [[ "$name" = "native_apple_ios-sim-x86_64" ]]; then
              bundle="ios-x86_64-sim"
            else
              echo "Skipping unknown artifact directory: $name"
              continue
            fi

            out_dir="bundles/${bundle}"
            mkdir -p "$out_dir"
            while IFS= read -r src; do
              [ -n "$src" ] || continue
              cp -f "$src" "${out_dir}/$(basename "$src")"
            done < <(find "$dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.dylib' -o -name '*.so' \) | sort)
          done

          for bundle_dir in bundles/*; do
            [ -d "$bundle_dir" ] || continue
            if ! find "$bundle_dir" -maxdepth 1 -type f -print -quit | grep -q .; then
              echo "Skipping empty bundle directory: $bundle_dir"
              continue
            fi
            bundle_name="$(basename "$bundle_dir")"
            archive="llamadart-native-${bundle_name}-${{ needs.resolve-tag.outputs.release_tag }}.tar.gz"
            tar -czf "release_assets/${archive}" -C "$bundle_dir" .
          done

          python3 tools/package_apple_xcframework.py \
            --tag "${{ needs.resolve-tag.outputs.release_tag }}" \
            --input-dir bundles \
            --output-dir release_assets \
            --clean

          mkdir -p \
            headers_bundle/libllamadart \
            headers_bundle/llama_cpp/include \
            headers_bundle/llama_cpp/ggml/include \
            headers_bundle/llama_cpp/tools/mtmd
          cp src/llama_dart_wrapper.h headers_bundle/libllamadart/
          shopt -s nullglob
          for hdr in third_party/llama.cpp/include/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/include/
          done
          for hdr in third_party/llama.cpp/ggml/include/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/ggml/include/
          done
          for hdr in third_party/llama.cpp/tools/mtmd/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/tools/mtmd/
          done
          HEADER_ARCHIVE="llamadart-native-headers-${{ needs.resolve-tag.outputs.release_tag }}.tar.gz"
          tar -czf "release_assets/${HEADER_ARCHIVE}" -C headers_bundle libllamadart llama_cpp

          ls -la release_assets
          test -n "$(find release_assets -maxdepth 1 -type f -print -quit)"

      - name: Generate manifest + checksums
        env:
          LLAMADART_LLAMA_CPP_TAG: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          LLAMADART_LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          LLAMADART_NATIVE_COMMIT: ${{ steps.provenance.outputs.native_commit }}
        run: |
          chmod +x scripts/generate_assets_manifest.sh
          scripts/generate_assets_manifest.sh \
            "${{ needs.resolve-tag.outputs.release_tag }}" \
            release_assets \
            release_assets/assets.json \
            release_assets/SHA256SUMS

      - name: Verify release tag is still unused
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
          LLAMA_CPP_REF: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
        run: |
          set -euo pipefail

          git fetch --tags --force origin

          existing_sha="$(git rev-parse -q --verify "refs/tags/${RELEASE_TAG}^{commit}" || true)"
          if [ -n "$existing_sha" ]; then
            echo "Release tag $RELEASE_TAG already exists at $existing_sha." >&2
            echo "Use a new native_release_tag for wrapper-only rebuilds, for example ${LLAMA_CPP_REF}-llamadart.1." >&2
            exit 1
          fi

          set +e
          release_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.html_url' 2>&1)"
          release_status=$?
          set -e
          if [ "$release_status" -eq 0 ]; then
            echo "GitHub release $RELEASE_TAG already exists at $release_url." >&2
            echo "Use a new native_release_tag for wrapper-only rebuilds, for example ${LLAMA_CPP_REF}-llamadart.1." >&2
            exit 1
          fi
          if ! grep -q "HTTP 404" <<< "$release_url"; then
            echo "Unable to verify whether GitHub release $RELEASE_TAG already exists:" >&2
            echo "$release_url" >&2
            exit 1
          fi

      - name: Push release provenance tag
        if: ${{ github.event.inputs.publish_release == 'true' }}
        env:
          RELEASE_TAG: ${{ needs.resolve-tag.outputs.release_tag }}
          NATIVE_COMMIT: ${{ steps.provenance.outputs.native_commit }}
        run: |
          set -euo pipefail

          git tag "$RELEASE_TAG" "$NATIVE_COMMIT"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Create release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-tag.outputs.release_tag }}
          name: ${{ needs.resolve-tag.outputs.release_tag }}
          body: |
            llama.cpp tag/ref: `${{ needs.resolve-tag.outputs.llama_cpp_ref }}`
            llama.cpp commit: `${{ needs.resolve-tag.outputs.llama_cpp_commit }}`
            llamadart-native commit: `${{ steps.provenance.outputs.native_commit }}`
          files: release_assets/*
          prerelease: false
          target_commitish: ${{ steps.provenance.outputs.native_commit }}

  update-llama-submodule:
    needs: [resolve-tag, package-and-release]
    if: ${{ github.event.inputs.publish_release == 'true' && needs.package-and-release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Move llama.cpp submodule to released tag
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Commit and push submodule update
        run: |
          set -euo pipefail

          if git diff --quiet -- third_party/llama.cpp; then
            echo "llama.cpp submodule already at ${{ needs.resolve-tag.outputs.llama_cpp_ref }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/llama.cpp
          git commit -m "chore: bump llama.cpp submodule to ${{ needs.resolve-tag.outputs.llama_cpp_ref }}"

          # main can move while this long workflow is running. Rebase and retry
          # so submodule bump is applied on top of the latest branch tip.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Submodule update pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${{ github.ref_name }} and retrying..."
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
          done

          echo "Failed to push submodule update after retries."
          exit 1
