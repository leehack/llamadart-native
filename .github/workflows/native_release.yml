name: Native Build & Release

run-name: native-${{ inputs.publish_release && 'publication-approval' || 'preparation' }} ${{ inputs.correlation_id }} source:${{ inputs.native_source_sha }} upstream:${{ inputs.llama_cpp_tag }} tag:${{ inputs.native_release_tag }}

on:
  workflow_dispatch:
    inputs:
      llama_cpp_tag:
        description: 'Exact llama.cpp release ref: vMAJOR.MINOR.PATCH stable or bNNNN nightly'
        required: true
      llama_cpp_commit:
        description: 'Expected exact 40-hex llama.cpp commit for the selected ref'
        required: true
      native_source_sha:
        description: 'Exact current default-branch native commit from candidate evidence'
        required: true
      native_release_tag:
        description: 'Exact native tag (upstream-aligned or compact -N wrapper rebuild)'
        required: true
      smoke_policy:
        description: 'Required package load smoke, or explicit skip for non-publishing preparation'
        required: true
        default: required
        type: choice
        options:
          - required
          - skip
      correlation_id:
        description: 'Stable caller correlation identifier (1-128 safe characters)'
        required: true
      publish_release:
        description: 'Explicit repository-owner publication approval; false is preparation-only'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: native-release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_NDK_VERSION: 28.2.13676358
  CUDA_REDIST_VERSION: 12.8.1
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_CUDA_COMPILER_LAUNCHER: ccache
  VCPKG_CACHE_VERSION: v1

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.contract.outputs.tag }}
      native_release_tag: ${{ steps.contract.outputs.native_release_tag }}
      llama_cpp_ref: ${{ steps.contract.outputs.llama_cpp_ref }}
      llama_cpp_commit: ${{ steps.llama-checkout.outputs.commit }}
      release_tag: ${{ steps.contract.outputs.native_release_tag }}
      upstream_channel: ${{ steps.contract.outputs.upstream_channel }}
      release_kind: ${{ steps.contract.outputs.release_kind }}
      github_prerelease: ${{ steps.contract.outputs.github_prerelease }}
      smoke_policy: ${{ steps.contract.outputs.smoke_policy }}
      correlation_id: ${{ steps.contract.outputs.correlation_id }}
      native_source_sha: ${{ steps.contract.outputs.native_source_sha }}
      publish_release: ${{ steps.contract.outputs.publish_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Validate exact approved dispatch
        id: contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_LLAMA_CPP_TAG: ${{ github.event.inputs.llama_cpp_tag }}
          INPUT_LLAMA_CPP_COMMIT: ${{ github.event.inputs.llama_cpp_commit }}
          INPUT_NATIVE_SOURCE_SHA: ${{ github.event.inputs.native_source_sha }}
          INPUT_NATIVE_RELEASE_TAG: ${{ github.event.inputs.native_release_tag }}
          INPUT_SMOKE_POLICY: ${{ github.event.inputs.smoke_policy }}
          INPUT_CORRELATION_ID: ${{ github.event.inputs.correlation_id }}
          INPUT_PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          APPROVAL_EVENT_NAME: ${{ github.event_name }}
          APPROVAL_ACTOR: ${{ github.actor }}
          APPROVAL_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          APPROVAL_REPOSITORY_OWNER: ${{ github.repository_owner }}
          APPROVAL_RUN_ATTEMPT: ${{ github.run_attempt }}
          APPROVAL_WORKFLOW_REF: ${{ github.ref }}
          APPROVAL_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          TAG="$INPUT_LLAMA_CPP_TAG"
          EXPECTED_COMMIT="$INPUT_LLAMA_CPP_COMMIT"
          RELEASE_TAG="$INPUT_NATIVE_RELEASE_TAG"

          python3 scripts/release_contract.py validate-dispatch \
            --upstream-ref "$TAG" \
            --upstream-commit "$EXPECTED_COMMIT" \
            --native-source-sha "$INPUT_NATIVE_SOURCE_SHA" \
            --native-release-tag "$RELEASE_TAG" \
            --smoke-policy "$INPUT_SMOKE_POLICY" \
            --correlation-id "$INPUT_CORRELATION_ID" \
            --publish-release "$INPUT_PUBLISH_RELEASE" \
            >> "$GITHUB_OUTPUT"

          default_branch=""
          default_branch_head="$INPUT_NATIVE_SOURCE_SHA"
          if [ "$INPUT_PUBLISH_RELEASE" = "true" ]; then
            default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
            default_branch_head="$(gh api \
              "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"
          fi
          python3 scripts/release_contract.py validate-publication-approval \
            --publish-release "$INPUT_PUBLISH_RELEASE" \
            --event-name "$APPROVAL_EVENT_NAME" \
            --actor "$APPROVAL_ACTOR" \
            --triggering-actor "$APPROVAL_TRIGGERING_ACTOR" \
            --repository-owner "$APPROVAL_REPOSITORY_OWNER" \
            --run-attempt "$APPROVAL_RUN_ATTEMPT" \
            --workflow-ref "$APPROVAL_WORKFLOW_REF" \
            --workflow-sha "$APPROVAL_WORKFLOW_SHA" \
            --native-source-sha "$INPUT_NATIVE_SOURCE_SHA" \
            --default-branch "$default_branch" \
            --default-branch-head "$default_branch_head"

          policy_args=(
            --upstream-ref "$TAG"
            --native-tag "$RELEASE_TAG"
          )

          if [ "$INPUT_PUBLISH_RELEASE" = "true" ]; then
            git fetch --tags origin
            existing_tags="$RUNNER_TEMP/existing-native-release-tags.txt"
            {
              git tag --list
              gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq '.[].tag_name'
            } | sort -u > "$existing_tags"
            policy_args+=(
              --existing-tags-file "$existing_tags"
              --allow-existing-candidate
            )
          fi

          python3 scripts/release_version_policy.py "${policy_args[@]}" >/dev/null
          echo "Validated exact llama.cpp ref/commit: $TAG at $EXPECTED_COMMIT"
          echo "Validated native release tag: $RELEASE_TAG"

      - name: Resolve exact llama.cpp commit
        id: llama-checkout
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ steps.contract.outputs.llama_cpp_ref }}
          expected_commit: ${{ steps.contract.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}

  build-android:
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - android_abi: arm64-v8a
            out_arch: arm64
            backend: vulkan
            include_core: true
            backend_glob: libggml-vulkan.so
          - android_abi: arm64-v8a
            out_arch: arm64
            backend: opencl
            include_core: false
            backend_glob: libggml-opencl.so
          - android_abi: x86_64
            out_arch: x64
            backend: vulkan
            include_core: true
            backend_glob: libggml-vulkan.so
          - android_abi: x86_64
            out_arch: x64
            backend: opencl
            include_core: false
            backend_glob: libggml-opencl.so
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK/NDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools ndk;${{ env.ANDROID_NDK_VERSION }}
      - name: Select pinned Android NDK
        run: |
          set -euo pipefail
          ANDROID_SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          NDK_DIR="$ANDROID_SDK_DIR/ndk/${ANDROID_NDK_VERSION}"
          test -d "$NDK_DIR" || { echo "Missing $NDK_DIR" >&2; exit 1; }
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using pinned Android NDK: $NDK_DIR"
      - name: Install build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-android-${{ matrix.android_abi }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ matrix.android_abi }}-${{ matrix.backend }}-
            ccache-android-${{ matrix.android_abi }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py android --abi ${{ matrix.android_abi }} --backend ${{ matrix.backend }}
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (android/${{ matrix.android_abi }}/${{ matrix.backend }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Android backend artifacts
        run: |
          set -euo pipefail

          OUT_DIR="bin/android/${{ matrix.out_arch }}"
          test -f "$OUT_DIR/${{ matrix.backend_glob }}" || { echo "Missing $OUT_DIR/${{ matrix.backend_glob }}"; exit 1; }

          READELF="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-readelf -print -quit)"
          if [ -z "$READELF" ]; then
            echo "Unable to locate llvm-readelf in ANDROID_NDK_HOME" >&2
            exit 1
          fi

          python3 tools/validate_android_artifacts.py --readelf "$READELF" "$OUT_DIR"

          if [ "${{ matrix.include_core }}" = "true" ]; then
            test -f "$OUT_DIR/libllamadart.so" || { echo "Missing $OUT_DIR/libllamadart.so"; exit 1; }
            test -f "$OUT_DIR/libllama-common.so" || { echo "Missing $OUT_DIR/libllama-common.so"; exit 1; }
            python3 tools/validate_exports.py \
              --format readelf \
              --tool "$READELF" \
              "$OUT_DIR/libllamadart.so"
          fi

          if [ "${{ matrix.android_abi }}" = "arm64-v8a" ]; then
            OBJDUMP="$(find "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt" -name llvm-objdump -print -quit)"
            if [ -z "$OBJDUMP" ]; then
              echo "Unable to locate llvm-objdump in ANDROID_NDK_HOME" >&2
              exit 1
            fi

            ARMV82_LIB="$OUT_DIR/libggml-cpu-android_armv8.2_2.so"
            test -f "$ARMV82_LIB" || { echo "Missing $ARMV82_LIB"; exit 1; }
            ARMV82_DISASM="$(mktemp)"
            SCORE_SYMS_FILE="$(mktemp)"
            trap 'rm -f "${DISASM_FILE:-}" "${ARMV82_DISASM:-}" "${SCORE_SYMS_FILE:-}"' EXIT
            "$OBJDUMP" -d --no-show-raw-insn "$ARMV82_LIB" > "$ARMV82_DISASM"
            if grep -Eq '\b(addvl|ptrue|cntw|rdvl|ld1b|st1b)\b' "$ARMV82_DISASM"; then
              echo "Found unexpected SVE instructions in $ARMV82_LIB" >&2
              exit 1
            fi

            if [ "${{ matrix.include_core }}" = "true" ]; then
              expected_cpu_variants=(
                "libggml-cpu-android_armv8.0_1.so"
                "libggml-cpu-android_armv8.2_1.so"
                "libggml-cpu-android_armv8.2_2.so"
                "libggml-cpu-android_armv8.6_1.so"
                "libggml-cpu-android_armv9.0_1.so"
                "libggml-cpu-android_armv9.2_1.so"
                "libggml-cpu-android_armv9.2_2.so"
              )
              for lib in "${expected_cpu_variants[@]}"; do
                test -f "$OUT_DIR/$lib" || { echo "Missing $OUT_DIR/$lib"; exit 1; }
                "$READELF" -Ws "$OUT_DIR/$lib" > "$SCORE_SYMS_FILE"
                if ! grep -Fq 'ggml_backend_score' "$SCORE_SYMS_FILE"; then
                  grep 'ggml_backend' "$SCORE_SYMS_FILE" || true
                  echo "Missing ggml_backend_score export in $OUT_DIR/$lib" >&2
                  exit 1
                fi
              done
            fi

            CPU_LIB="$OUT_DIR/libggml-cpu-android_armv8.0_1.so"
            if [ ! -f "$CPU_LIB" ]; then
              CPU_LIB="$OUT_DIR/libggml-cpu.so"
            fi
            test -f "$CPU_LIB" || { echo "Missing $CPU_LIB"; exit 1; }

            DISASM_FILE="$(mktemp)"
            "$OBJDUMP" -d "$CPU_LIB" > "$DISASM_FILE"

            if grep -Eiq 'stlurh?|stlurb' "$DISASM_FILE"; then
              echo "Found unsupported armv8.4-a LRCPC2 STLUR instructions in $CPU_LIB" >&2
              exit 1
            fi
          fi
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/android/${{ matrix.out_arch }}"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          if [ "${{ matrix.include_core }}" = "true" ]; then
            cp "$OUT_DIR"/*.so "$PAYLOAD"/
          else
            cp "$OUT_DIR/${{ matrix.backend_glob }}" "$PAYLOAD"/
          fi
          ls -la "$PAYLOAD"
          test -n "$(find "$PAYLOAD" -maxdepth 1 -type f -print -quit)"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: native_android_${{ matrix.android_abi }}_${{ matrix.backend }}
          path: artifact_payload/*

  build-apple:
    needs: resolve-tag
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            out_dir: macos/arm64
          - target: macos-x86_64
            out_dir: macos/x86_64
          - target: ios-device-arm64
            out_dir: ios/arm64
          - target: ios-sim-arm64
            out_dir: ios/arm64-sim
          - target: ios-sim-x86_64
            out_dir: ios/x86_64-sim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install ccache
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-apple-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            ccache-apple-${{ matrix.target }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py apple --target ${{ matrix.target }}
      - name: Validate Apple wrapper exports
        run: |
          OUT_LIB="bin/${{ matrix.out_dir }}/libllamadart.dylib"
          test -f "$OUT_LIB" || { echo "Missing $OUT_LIB"; exit 1; }
          python3 tools/validate_exports.py --format nm --tool nm "$OUT_LIB"
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (apple/${{ matrix.target }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: native_apple_${{ matrix.target }}
          path: bin/${{ matrix.out_dir }}/*

  build-linux:
    needs: resolve-tag
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            backend: vulkan
            include_core: true
            needs_vulkan: true
            needs_openblas: false
            needs_cuda: false
            backend_glob: libggml-vulkan.so
          - arch: x64
            backend: cuda
            include_core: false
            needs_vulkan: false
            needs_openblas: false
            needs_cuda: true
            backend_glob: libggml-cuda.so
          - arch: x64
            backend: blas
            include_core: false
            needs_vulkan: false
            needs_openblas: true
            needs_cuda: false
            backend_glob: libggml-blas.so
          - arch: arm64
            backend: vulkan
            include_core: true
            needs_vulkan: true
            needs_openblas: false
            needs_cuda: false
            backend_glob: libggml-vulkan.so
          - arch: arm64
            backend: blas
            include_core: false
            needs_vulkan: false
            needs_openblas: true
            needs_cuda: false
            backend_glob: libggml-blas.so
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: |
          apt_get_update() {
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 update; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install() {
            for attempt in 1 2 3; do
              if sudo apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }

          if [ "${{ matrix.arch }}" = "arm64" ]; then
            sudo dpkg --add-architecture arm64
            source /etc/os-release
            CODENAME="${VERSION_CODENAME}"
            {
              printf '%s\n' \
                "Types: deb" \
                "URIs: http://archive.ubuntu.com/ubuntu" \
                "Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports" \
                "Components: main universe restricted multiverse" \
                "Architectures: amd64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
                "" \
                "Types: deb" \
                "URIs: http://security.ubuntu.com/ubuntu" \
                "Suites: ${CODENAME}-security" \
                "Components: main universe restricted multiverse" \
                "Architectures: amd64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg" \
                "" \
                "Types: deb" \
                "URIs: http://ports.ubuntu.com/ubuntu-ports" \
                "Suites: ${CODENAME} ${CODENAME}-updates ${CODENAME}-backports ${CODENAME}-security" \
                "Components: main universe restricted multiverse" \
                "Architectures: arm64" \
                "Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg"
            } | sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null
          fi
          apt_get_update
          apt_get_install ccache ninja-build pkg-config make
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            apt_get_install gcc-aarch64-linux-gnu g++-aarch64-linux-gnu qemu-user
          fi
          if [ "${{ matrix.needs_vulkan }}" = "true" ]; then
            apt_get_install libvulkan-dev glslc
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              apt_get_install libvulkan-dev:arm64
            fi
          fi
          if [ "${{ matrix.needs_openblas }}" = "true" ]; then
            if [ "${{ matrix.arch }}" = "arm64" ]; then
              apt_get_install libopenblas-dev:arm64
            else
              apt_get_install libopenblas-dev
            fi
          fi
          if [ "${{ matrix.needs_cuda }}" = "true" ]; then
            cuda_root="${RUNNER_TEMP}/cuda-${CUDA_REDIST_VERSION}"
            python3 tools/install_cuda_redist.py \
              --version "${CUDA_REDIST_VERSION}" \
              --platform linux-x86_64 \
              --destination "${cuda_root}"
            test -f "${cuda_root}/lib64/libcudadevrt.a" || { echo "Missing CUDA device runtime static library" >&2; exit 1; }
            test -f "${cuda_root}/lib64/libcudart_static.a" || { echo "Missing CUDA runtime static library" >&2; exit 1; }
            {
              echo "${cuda_root}/bin"
              echo "${cuda_root}/nvvm/bin"
            } >> "${GITHUB_PATH}"
            {
              echo "CUDA_PATH=${cuda_root}"
              echo "CUDAToolkit_ROOT=${cuda_root}"
              echo "LD_LIBRARY_PATH=${cuda_root}/lib64:${cuda_root}/lib64/stubs:${cuda_root}/lib:${cuda_root}/lib/stubs:${LD_LIBRARY_PATH:-}"
            } >> "${GITHUB_ENV}"
            "${cuda_root}/bin/nvcc" --version | tee nvcc-version.txt
            grep -q 'release 12\.8' nvcc-version.txt || {
              echo "Expected CUDA ${CUDA_REDIST_VERSION} nvcc" >&2
              exit 1
            }
          fi
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-${{ matrix.arch }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ matrix.backend }}-
            ccache-linux-${{ matrix.arch }}-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py linux --arch "${{ matrix.arch }}" --backend "${{ matrix.backend }}"
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (linux/${{ matrix.arch }}/${{ matrix.backend }})"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Linux backend artifacts
        run: |
          OUT_DIR="bin/linux/${{ matrix.arch }}"
          test -f "$OUT_DIR/${{ matrix.backend_glob }}" || { echo "Missing $OUT_DIR/${{ matrix.backend_glob }}"; exit 1; }
          if [ "${{ matrix.include_core }}" = "true" ]; then
            test -f "$OUT_DIR/libllamadart.so" || { echo "Missing $OUT_DIR/libllamadart.so"; exit 1; }
            python3 tools/validate_exports.py \
              --format readelf \
              --tool readelf \
              "$OUT_DIR/libllamadart.so"
          fi
          for lib in "$OUT_DIR"/*.so; do
            readelf -d "$lib" | grep -E 'Library runpath: \[\$ORIGIN(:|\])' >/dev/null || {
              echo "Expected RUNPATH to start with \$ORIGIN in $lib" >&2
              readelf -d "$lib" | grep -F 'RUNPATH' >&2 || true
              exit 1
            }
          done
          if [ "${{ matrix.needs_cuda }}" = "true" ]; then
            CACHE_FILE="build/linux-x64-full/CMakeCache.txt"
            test -f "$CACHE_FILE" || { echo "Missing CMake cache at $CACHE_FILE"; exit 1; }
            grep -R \
              --include='CMakeCache.txt' \
              --include='*.ninja' \
              --include='*.vcxproj' \
              -E '120a-real|compute_120a|sm_120a' build/linux-x64-full >/dev/null || \
              strings "$OUT_DIR/${{ matrix.backend_glob }}" | grep -E 'compute_120a|sm_120a' >/dev/null || {
              echo "Expected CUDA Blackwell architecture marker in linux CUDA build" >&2
              exit 1
            }
            ldd "$OUT_DIR/${{ matrix.backend_glob }}" | tee ldd-cuda.txt
            missing_deps="$(awk '/not found/ { print $1 }' ldd-cuda.txt || true)"
            unexpected_missing=0
            for dep in $missing_deps; do
              if [ "$dep" = "libcuda.so.1" ]; then
                continue
              fi
              case "$dep" in
                libggml*.so.*|libllama.so.*|libmtmd.so.*)
                  canonical="${dep%%.so.*}.so"
                  if [ -f "$OUT_DIR/$canonical" ]; then
                    continue
                  fi
                  ;;
              esac
              echo "Unexpected unresolved shared library dependency: $dep" >&2
              unexpected_missing=1
            done
            if [ "$unexpected_missing" -ne 0 ]; then
              exit 1
            fi
          fi
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            CACHE_FILE="build/linux-arm64-full/CMakeCache.txt"
            test -f "$CACHE_FILE" || { echo "Missing CMake cache at $CACHE_FILE"; exit 1; }
            grep -q '^GGML_CPU_KLEIDIAI:BOOL=ON$' "$CACHE_FILE" || { echo "Kleidi is not enabled in arm64 build"; exit 1; }
          fi
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/linux/${{ matrix.arch }}"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          if [ "${{ matrix.include_core }}" = "true" ]; then
            python3 tools/package_linux_artifact.py \
              --input-dir "$OUT_DIR" \
              --output "$PAYLOAD/runtime.tar.gz"
            python3 tools/validate_linux_artifact.py "$PAYLOAD/runtime.tar.gz"
          else
            python3 tools/package_linux_artifact.py \
              --input-dir "$OUT_DIR" \
              --output "$PAYLOAD/runtime.tar.gz" \
              --pattern "${{ matrix.backend_glob }}"
          fi
          ls -la "$PAYLOAD"
      - name: Validate clean Linux consumer dlopen
        if: ${{ matrix.include_core }}
        run: |
          EXTRACT_DIR="${RUNNER_TEMP}/llamadart-clean-${{ matrix.arch }}"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf artifact_payload/runtime.tar.gz -C "$EXTRACT_DIR"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            aarch64-linux-gnu-gcc tools/linux_dlopen_smoke.c -o "${RUNNER_TEMP}/linux-dlopen-smoke-arm64" -ldl
            env -u LD_LIBRARY_PATH qemu-aarch64 -L /usr/aarch64-linux-gnu \
              "${RUNNER_TEMP}/linux-dlopen-smoke-arm64" "$EXTRACT_DIR/libllamadart.so"
          else
            cc tools/linux_dlopen_smoke.c -o "${RUNNER_TEMP}/linux-dlopen-smoke-x64" -ldl
            env -u LD_LIBRARY_PATH \
              "${RUNNER_TEMP}/linux-dlopen-smoke-x64" "$EXTRACT_DIR/libllamadart.so"
          fi
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: native_linux_${{ matrix.arch }}_${{ matrix.backend }}
          path: artifact_payload/*

  build-linux-hip:
    needs: resolve-tag
    runs-on: ubuntu-latest
    container: rocm/dev-ubuntu-22.04:6.1.2
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 5G
    steps:
      - name: Install Git
        run: |
          apt_get_update() {
            for attempt in 1 2 3; do
              if apt-get -o Acquire::Retries=3 update; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install() {
            for attempt in 1 2 3; do
              if DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_update
          apt_get_install git
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install build deps
        run: |
          apt_get_install() {
            for attempt in 1 2 3; do
              if DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y "$@"; then
                return 0
              fi
              if [ "$attempt" = "3" ]; then
                return 1
              fi
              sleep $((attempt * 15))
            done
          }
          apt_get_install build-essential binutils ccache ninja-build pkg-config python3 python3-pip rocblas-dev hipblas-dev
          python3 -m pip install --upgrade cmake
          cmake --version
      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-linux-x64-hip-${{ github.run_id }}
          restore-keys: |
            ccache-linux-x64-hip-
      - name: Prime ccache
        run: |
          mkdir -p "${CCACHE_DIR}"
          ccache --max-size "${CCACHE_MAXSIZE}"
          ccache --zero-stats
      - name: Build
        run: python3 tools/build.py linux --arch x64 --backend hip
      - name: ccache stats
        if: always()
        run: ccache --show-stats || true
      - name: Append ccache stats to summary
        if: always()
        run: |
          {
            echo "### ccache stats (linux/x64/hip)"
            echo '```'
            ccache --show-stats || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Linux HIP artifacts
        run: |
          OUT_DIR="bin/linux/x64"
          test -f "$OUT_DIR/libggml-hip.so" || { echo "Missing $OUT_DIR/libggml-hip.so"; exit 1; }
          for lib in "$OUT_DIR"/*.so; do
            readelf -d "$lib" | grep -E 'Library runpath: \[\$ORIGIN(:|\])' >/dev/null || {
              echo "Expected RUNPATH to start with \$ORIGIN in $lib" >&2
              readelf -d "$lib" | grep -F 'RUNPATH' >&2 || true
              exit 1
            }
          done
      - name: Stage upload payload
        run: |
          OUT_DIR="bin/linux/x64"
          PAYLOAD="artifact_payload"
          mkdir -p "$PAYLOAD"
          python3 tools/package_linux_artifact.py \
            --input-dir "$OUT_DIR" \
            --output "$PAYLOAD/runtime.tar.gz" \
            --pattern "libggml-hip.so"
          ls -la "$PAYLOAD"
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: native_linux_x64_hip
          path: artifact_payload/*

  build-windows:
    needs: resolve-tag
    runs-on: ${{ matrix.runs_on }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-latest
            backend: vulkan
            include_core: true
            needs_cuda: false
            needs_openblas: false
            needs_vulkan: true
            backend_glob: "*ggml-vulkan*.dll"
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-2022
            backend: cuda
            include_core: false
            needs_cuda: true
            needs_openblas: false
            needs_vulkan: false
            backend_glob: "*ggml-cuda*.dll"
          - arch: x64
            vcpkg_triplet: x64-windows
            runs_on: windows-latest
            backend: blas
            include_core: false
            needs_cuda: false
            needs_openblas: true
            needs_vulkan: false
            backend_glob: "*ggml-blas*.dll"
          - arch: arm64
            vcpkg_triplet: arm64-windows
            runs_on: windows-11-arm
            backend: vulkan
            include_core: true
            needs_cuda: false
            needs_openblas: false
            needs_vulkan: true
            backend_glob: "*ggml-vulkan*.dll"
          - arch: arm64
            vcpkg_triplet: arm64-windows
            runs_on: windows-11-arm
            backend: blas
            include_core: false
            needs_cuda: false
            needs_openblas: true
            needs_vulkan: false
            backend_glob: "*ggml-blas*.dll"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Enable Git Long Paths
        run: git config --global core.longpaths true
      - name: Setup MSVC (x64)
        if: ${{ matrix.arch == 'x64' }}
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      - name: Setup MSVC (arm64 cross)
        if: ${{ matrix.arch == 'arm64' }}
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: arm64
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Install Ninja
        if: ${{ matrix.arch == 'x64' }}
        run: choco install ninja -y
      - name: Install CUDA Toolkit
        if: ${{ matrix.needs_cuda }}
        run: |
          $cudaRoot = Join-Path $env:ProgramFiles "NVIDIA GPU Computing Toolkit\CUDA\v12.8"
          python tools/install_cuda_redist.py `
            --version "${env:CUDA_REDIST_VERSION}" `
            --platform windows-x86_64 `
            --destination "$cudaRoot"
          Add-Content $env:GITHUB_PATH (Join-Path $cudaRoot "bin")
          Add-Content $env:GITHUB_PATH (Join-Path $cudaRoot "nvvm\bin")
          Add-Content $env:GITHUB_ENV "CUDA_PATH=$cudaRoot"
          Add-Content $env:GITHUB_ENV "CUDAToolkit_ROOT=$cudaRoot"
          $nvccVersion = & (Join-Path $cudaRoot "bin\nvcc.exe") --version
          $nvccVersion
          if (($nvccVersion -join "`n") -notmatch 'release 12\.8') {
            throw "Expected CUDA ${env:CUDA_REDIST_VERSION} nvcc"
          }
      - name: Restore vcpkg cache
        if: ${{ matrix.needs_openblas }}
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_CACHE_VERSION }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-
      - name: Install OpenBLAS (vcpkg)
        if: ${{ matrix.needs_openblas }}
        run: |
          $vcpkgRoot = "C:\vcpkg"
          if (-not (Test-Path $vcpkgRoot)) {
            git clone https://github.com/microsoft/vcpkg "$vcpkgRoot"
          }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          }
          $openblasLib = Join-Path $vcpkgRoot "installed\${{ matrix.vcpkg_triplet }}\lib\openblas.lib"
          if (-not (Test-Path $openblasLib)) {
            & "$vcpkgRoot\vcpkg.exe" install "openblas:${{ matrix.vcpkg_triplet }}"
          } else {
            Write-Host "OpenBLAS already present in cache: $openblasLib"
          }

          $pkgconfCandidates = @(
            (Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkg-config.exe"),
            (Join-Path $vcpkgRoot "installed\x64-windows\tools\pkgconf\pkgconf.exe")
          )
          $pkgconf = $pkgconfCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pkgconf) {
            & "$vcpkgRoot\vcpkg.exe" install "pkgconf:x64-windows"
            $pkgconf = $pkgconfCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $pkgconf) {
            throw "pkg-config executable not found in vcpkg tools"
          }
          Add-Content $env:GITHUB_PATH (Split-Path $pkgconf -Parent)
          Add-Content $env:GITHUB_ENV "PKG_CONFIG_EXECUTABLE=$pkgconf"
          Add-Content $env:GITHUB_ENV "VCPKG_ROOT=$vcpkgRoot"
      - name: Setup sccache
        if: ${{ matrix.arch == 'x64' }}
        uses: mozilla-actions/sccache-action@v0.0.11
      - name: Configure sccache
        if: ${{ matrix.arch == 'x64' }}
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $env:GITHUB_ENV
      - name: Disable sccache for arm64 Visual Studio builds
        if: ${{ matrix.arch == 'arm64' }}
        run: |
          Add-Content $env:GITHUB_ENV "CMAKE_C_COMPILER_LAUNCHER="
          Add-Content $env:GITHUB_ENV "CMAKE_CXX_COMPILER_LAUNCHER="
      - name: Install Vulkan SDK
        if: ${{ matrix.needs_vulkan }}
        run: |
          $ver = "1.4.313.2"
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkansdk-windows-X64-$ver.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$ver"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$ver\Bin"
      - name: Build
        run: python tools/build.py windows --arch ${{ matrix.arch }} --backend ${{ matrix.backend }}
      - name: Validate Windows backend artifacts
        run: |
          $out = "bin/windows/${{ matrix.arch }}"
          if (-not (Get-ChildItem $out -Filter "${{ matrix.backend_glob }}" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
            throw "Missing backend DLL '${{ matrix.backend_glob }}' in $out"
          }
          if ("${{ matrix.backend }}" -eq "cuda") {
            if (-not (Get-ChildItem $out -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cudart64_*.dll) in $out"
            }
            if (-not (Get-ChildItem $out -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cublas64_*.dll) in $out"
            }
            if (-not (Get-ChildItem $out -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing CUDA runtime dependency (cublasLt64_*.dll) in $out"
            }
            $cache = "build/wx64/CMakeCache.txt"
            if (-not (Test-Path $cache)) {
              throw "Missing CMake cache at $cache"
            }
            $cudaArchFiles = Get-ChildItem "build/wx64" -Recurse -File -Include CMakeCache.txt,*.ninja,*.vcxproj
            if (-not ($cudaArchFiles | Select-String -Pattern "120a-real|compute_120a|sm_120a" -Quiet)) {
              throw "Expected CUDA Blackwell architecture marker in windows CUDA build"
            }
            $cudaBin = Join-Path $env:CUDA_PATH "bin"
            $cudaDlls = @()
            $cudaDlls += Get-ChildItem $out -Filter "cudart64_*.dll"
            $cudaDlls += Get-ChildItem $out -Filter "cublas64_*.dll"
            $cudaDlls += Get-ChildItem $out -Filter "cublasLt64_*.dll"
            foreach ($dll in $cudaDlls) {
              $source = Join-Path $cudaBin $dll.Name
              if (-not (Test-Path $source)) {
                throw "Packaged CUDA DLL $($dll.Name) is not present in CUDA_PATH"
              }
              $packagedHash = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
              $sourceHash = (Get-FileHash $source -Algorithm SHA256).Hash
              if ($packagedHash -ne $sourceHash) {
                throw "Packaged CUDA DLL $($dll.Name) does not match CUDA_PATH"
              }
            }
          }
          if ("${{ matrix.backend }}" -eq "blas") {
            if (-not (Get-ChildItem $out -Filter "openblas*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1)) {
              throw "Missing BLAS runtime dependency (openblas*.dll) in $out"
            }
          }
          if ("${{ matrix.include_core }}" -eq "true") {
            $wrapper = Get-ChildItem $out -Filter "*llamadart*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $wrapper) {
              throw "Missing core wrapper DLL in $out"
            }
            python tools/validate_exports.py --format dumpbin --tool dumpbin $wrapper.FullName
          }
          if ("${{ matrix.arch }}" -eq "arm64") {
            $cache = "build/wa64/CMakeCache.txt"
            if (-not (Test-Path $cache)) {
              throw "Missing CMake cache at $cache"
            }
            if (-not (Select-String -Path $cache -Pattern '^GGML_CPU_KLEIDIAI:BOOL=ON$' -Quiet)) {
              throw "Kleidi is not enabled in windows arm64 build"
            }
          }
      - name: Stage upload payload
        run: |
          $out = "bin/windows/${{ matrix.arch }}"
          $payload = "artifact_payload"
          New-Item -ItemType Directory -Force -Path $payload | Out-Null

          if ("${{ matrix.include_core }}" -eq "true") {
            $files = Get-ChildItem $out -Filter "*.dll" -ErrorAction Stop
          } else {
            $files = @(
              Get-ChildItem $out -Filter "${{ matrix.backend_glob }}" -ErrorAction Stop
            )
            if ("${{ matrix.backend }}" -eq "cuda") {
              $files += Get-ChildItem $out -Filter "cudart64_*.dll" -ErrorAction SilentlyContinue
              $files += Get-ChildItem $out -Filter "cublas64_*.dll" -ErrorAction SilentlyContinue
              $files += Get-ChildItem $out -Filter "cublasLt64_*.dll" -ErrorAction SilentlyContinue
            }
            if ("${{ matrix.backend }}" -eq "blas") {
              $files += Get-ChildItem $out -Filter "openblas*.dll" -ErrorAction SilentlyContinue
            }
            $files = $files | Sort-Object FullName -Unique
          }
          if (-not $files) {
            throw "No files staged for upload"
          }
          foreach ($f in $files) {
            Copy-Item $f.FullName -Destination $payload -Force
          }
          Get-ChildItem $payload
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: native_windows_${{ matrix.arch }}_${{ matrix.backend }}
          path: artifact_payload/*
      - name: Save vcpkg cache
        if: ${{ always() && matrix.needs_openblas && steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            C:\vcpkg\downloads
            C:\vcpkg\packages
            C:\vcpkg\installed
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg_triplet }}-${{ env.VCPKG_CACHE_VERSION }}

  smoke-release-contract:
    needs: [resolve-tag, build-linux]
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.conclusion.outputs.conclusion }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Linux x64 core bundle
        if: ${{ needs.resolve-tag.outputs.smoke_policy == 'required' }}
        uses: actions/download-artifact@v8
        with:
          name: native_linux_x64_vulkan
          path: candidate-linux-x64
      - name: Extract Linux x64 core bundle
        if: ${{ needs.resolve-tag.outputs.smoke_policy == 'required' }}
        run: |
          set -euo pipefail
          mkdir -p candidate-linux-x64/extracted
          tar -xzf candidate-linux-x64/runtime.tar.gz \
            -C candidate-linux-x64/extracted
      - name: Load packaged wrapper and call model-free API probe
        if: ${{ needs.resolve-tag.outputs.smoke_policy == 'required' }}
        run: python3 tools/smoke_linux_bundle.py candidate-linux-x64/extracted
      - name: Record smoke conclusion
        id: conclusion
        run: |
          if [ "${{ needs.resolve-tag.outputs.smoke_policy }}" = "required" ]; then
            echo "conclusion=passed" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=skipped" >> "$GITHUB_OUTPUT"
          fi

  package-and-release:
    needs: [resolve-tag, build-android, build-apple, build-linux, build-linux-hip, build-windows, smoke-release-contract]
    runs-on: macos-latest
    outputs:
      native_commit: ${{ steps.provenance.outputs.native_commit }}
      publication_artifact_id: ${{ steps.upload-publication.outputs.artifact-id }}
      publication_artifact_url: ${{ steps.upload-publication.outputs.artifact-url }}
      publication_artifact_digest: ${{ steps.upload-publication.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout llama.cpp ref
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Create release provenance commit
        id: provenance
        env:
          LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          LLAMA_CPP_REF: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
        run: |
          set -euo pipefail

          actual_commit="$(git -C third_party/llama.cpp rev-parse HEAD)"
          if [ "$actual_commit" != "$LLAMA_CPP_COMMIT" ]; then
            echo "llama.cpp provenance mismatch: expected $LLAMA_CPP_COMMIT, checked out $actual_commit" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/llama.cpp
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin llama.cpp provenance for $LLAMA_CPP_REF"
          fi

          native_commit="$(git rev-parse HEAD)"
          tree_commit="$(git ls-tree HEAD third_party/llama.cpp | awk '{print $3}')"
          if [ "$tree_commit" != "$LLAMA_CPP_COMMIT" ]; then
            echo "Release commit $native_commit records llama.cpp $tree_commit, expected $LLAMA_CPP_COMMIT" >&2
            exit 1
          fi

          echo "native_commit=$native_commit" >> "$GITHUB_OUTPUT"
          echo "Release provenance commit: $native_commit"
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release_assets
          mkdir -p bundles

          for dir in artifacts/native_*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"

            bundle=""
            if [[ "$name" =~ ^native_windows_(x64|arm64)(_.+)?$ ]]; then
              bundle="windows-${BASH_REMATCH[1]}"
            elif [[ "$name" =~ ^native_linux_(x64|arm64)(_.+)?$ ]]; then
              bundle="linux-${BASH_REMATCH[1]}"
            elif [[ "$name" =~ ^native_android_(arm64-v8a|x86_64)(_.+)?$ ]]; then
              if [ "${BASH_REMATCH[1]}" = "arm64-v8a" ]; then
                bundle="android-arm64"
              else
                bundle="android-x64"
              fi
            elif [[ "$name" = "native_apple_macos-arm64" ]]; then
              bundle="macos-arm64"
            elif [[ "$name" = "native_apple_macos-x86_64" ]]; then
              bundle="macos-x86_64"
            elif [[ "$name" = "native_apple_ios-device-arm64" ]]; then
              bundle="ios-arm64"
            elif [[ "$name" = "native_apple_ios-sim-arm64" ]]; then
              bundle="ios-arm64-sim"
            elif [[ "$name" = "native_apple_ios-sim-x86_64" ]]; then
              bundle="ios-x86_64-sim"
            else
              echo "Skipping unknown artifact directory: $name"
              continue
            fi

            out_dir="bundles/${bundle}"
            mkdir -p "$out_dir"
            if [[ "$bundle" = linux-* ]]; then
              shopt -s nullglob
              archives=("$dir"/*.tar.gz)
              [ "${#archives[@]}" -eq 1 ] || {
                echo "Expected one Linux runtime archive in $dir, found ${#archives[@]}" >&2
                exit 1
              }
              tar -xzf "${archives[0]}" -C "$out_dir"
            else
              while IFS= read -r src; do
                [ -n "$src" ] || continue
                cp -f "$src" "${out_dir}/$(basename "$src")"
              done < <(find "$dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.dylib' -o -name '*.so' \) | sort)
            fi
          done

          for bundle_dir in bundles/*; do
            [ -d "$bundle_dir" ] || continue
            if ! find "$bundle_dir" -maxdepth 1 -type f -print -quit | grep -q .; then
              echo "Skipping empty bundle directory: $bundle_dir"
              continue
            fi
            bundle_name="$(basename "$bundle_dir")"
            archive="llamadart-native-${bundle_name}-${{ needs.resolve-tag.outputs.release_tag }}.tar.gz"
            tar -czf "release_assets/${archive}" -C "$bundle_dir" .
          done

          python3 tools/package_apple_xcframework.py \
            --tag "${{ needs.resolve-tag.outputs.release_tag }}" \
            --input-dir bundles \
            --output-dir release_assets \
            --clean

          mkdir -p \
            headers_bundle/libllamadart \
            headers_bundle/llama_cpp/include \
            headers_bundle/llama_cpp/ggml/include \
            headers_bundle/llama_cpp/tools/mtmd
          cp src/llama_dart_wrapper.h headers_bundle/libllamadart/
          shopt -s nullglob
          for hdr in third_party/llama.cpp/include/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/include/
          done
          for hdr in third_party/llama.cpp/ggml/include/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/ggml/include/
          done
          for hdr in third_party/llama.cpp/tools/mtmd/*.{h,hpp}; do
            cp "$hdr" headers_bundle/llama_cpp/tools/mtmd/
          done
          HEADER_ARCHIVE="llamadart-native-headers-${{ needs.resolve-tag.outputs.release_tag }}.tar.gz"
          tar -czf "release_assets/${HEADER_ARCHIVE}" -C headers_bundle libllamadart llama_cpp

          for archive in release_assets/llamadart-native-linux-*.tar.gz; do
            python3 tools/validate_linux_artifact.py "$archive"
          done

          ls -la release_assets
          test -n "$(find release_assets -maxdepth 1 -type f -print -quit)"

      - name: Generate manifest + checksums
        env:
          LLAMADART_LLAMA_CPP_TAG: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          LLAMADART_LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          LLAMADART_NATIVE_COMMIT: ${{ steps.provenance.outputs.native_commit }}
          LLAMADART_CORRELATION_ID: ${{ needs.resolve-tag.outputs.correlation_id }}
          LLAMADART_SMOKE_POLICY: ${{ needs.resolve-tag.outputs.smoke_policy }}
          LLAMADART_SMOKE_CONCLUSION: ${{ needs.smoke-release-contract.outputs.conclusion }}
          LLAMADART_WORKFLOW_RUN_ID: ${{ github.run_id }}
          LLAMADART_WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LLAMADART_WORKFLOW_HEAD_SHA: ${{ github.sha }}
        run: |
          chmod +x scripts/generate_assets_manifest.sh
          scripts/generate_assets_manifest.sh \
            "${{ needs.resolve-tag.outputs.release_tag }}" \
            release_assets \
            release_assets/assets.json \
            release_assets/SHA256SUMS

      - name: Bundle immutable publication inputs
        env:
          NATIVE_COMMIT: ${{ steps.provenance.outputs.native_commit }}
        run: |
          set -euo pipefail

          mkdir -p publication
          git update-ref refs/heads/release-provenance "$NATIVE_COMMIT"
          trap 'git update-ref -d refs/heads/release-provenance' EXIT
          git bundle create \
            publication/release-provenance.bundle \
            refs/heads/release-provenance
          printf '%s\n' "$NATIVE_COMMIT" > publication/native_commit

      - name: Upload verified publication transaction
        id: upload-publication
        uses: actions/upload-artifact@v7
        with:
          name: release-publication-${{ github.run_id }}
          path: |
            release_assets
            publication
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: [resolve-tag, smoke-release-contract, package-and-release]
    if: ${{ needs.resolve-tag.outputs.publish_release == 'true' && needs.package-and-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Download verified publication transaction
        uses: actions/download-artifact@v8
        with:
          name: release-publication-${{ github.run_id }}
          path: prepared
      - name: Import and verify immutable provenance commit
        env:
          EXPECTED_NATIVE_COMMIT: ${{ needs.package-and-release.outputs.native_commit }}
          EXPECTED_LLAMA_CPP_COMMIT: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
        run: |
          set -euo pipefail

          recorded_native_commit="$(cat prepared/publication/native_commit)"
          if [ "$recorded_native_commit" != "$EXPECTED_NATIVE_COMMIT" ]; then
            echo "Publication artifact native commit mismatch" >&2
            exit 1
          fi
          git fetch \
            prepared/publication/release-provenance.bundle \
            refs/heads/release-provenance:refs/remotes/publication/release-provenance
          imported_native_commit="$(git rev-parse refs/remotes/publication/release-provenance)"
          if [ "$imported_native_commit" != "$EXPECTED_NATIVE_COMMIT" ]; then
            echo "Imported provenance commit mismatch" >&2
            exit 1
          fi
          tree_commit="$(git ls-tree "$EXPECTED_NATIVE_COMMIT" third_party/llama.cpp | awk '{print $3}')"
          if [ "$tree_commit" != "$EXPECTED_LLAMA_CPP_COMMIT" ]; then
            echo "Imported provenance tree records llama.cpp $tree_commit, expected $EXPECTED_LLAMA_CPP_COMMIT" >&2
            exit 1
          fi

      - name: Publish exact draft-first transaction
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_publication.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ needs.resolve-tag.outputs.release_tag }}" \
            --native-commit "${{ needs.package-and-release.outputs.native_commit }}" \
            --upstream-ref "${{ needs.resolve-tag.outputs.llama_cpp_ref }}" \
            --upstream-commit "${{ needs.resolve-tag.outputs.llama_cpp_commit }}" \
            --assets-dir prepared/release_assets \
            --prerelease "${{ needs.resolve-tag.outputs.github_prerelease }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow-head-sha "${{ github.sha }}" \
            --artifact-digest "${{ needs.package-and-release.outputs.publication_artifact_digest }}" \
            --correlation-id "${{ needs.resolve-tag.outputs.correlation_id }}" \
            --smoke-policy "${{ needs.resolve-tag.outputs.smoke_policy }}" \
            --smoke-conclusion "${{ needs.smoke-release-contract.outputs.conclusion }}"

  update-llama-submodule:
    needs: [resolve-tag, publish-release]
    if: ${{ needs.resolve-tag.outputs.publish_release == 'true' && needs.publish-release.result == 'success' && needs.resolve-tag.outputs.upstream_channel == 'stable' && needs.resolve-tag.outputs.release_kind == 'upstream' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: true
      - name: Move llama.cpp submodule to released tag
        uses: ./.github/actions/checkout-llama-ref
        with:
          tag: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
          expected_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
          github_token: ${{ github.token }}
      - name: Commit and push submodule update
        run: |
          set -euo pipefail

          if git diff --quiet -- third_party/llama.cpp; then
            echo "llama.cpp submodule already at ${{ needs.resolve-tag.outputs.llama_cpp_ref }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add third_party/llama.cpp
          git commit -m "chore: bump llama.cpp submodule to ${{ needs.resolve-tag.outputs.llama_cpp_ref }}"

          # main can move while this long workflow is running. Rebase and retry
          # so submodule bump is applied on top of the latest branch tip.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "Submodule update pushed on attempt ${attempt}."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}); rebasing onto origin/${{ github.ref_name }} and retrying..."
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
          done

          echo "Failed to push submodule update after retries."
          exit 1

  emit-release-result:
    needs: [resolve-tag, smoke-release-contract, package-and-release, publish-release, update-llama-submodule]
    if: ${{ always() && needs.smoke-release-contract.result == 'success' && needs.package-and-release.result == 'success' && (needs.resolve-tag.outputs.publish_release != 'true' || needs.publish-release.result == 'success') && (needs.update-llama-submodule.result == 'success' || needs.update-llama-submodule.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      native_release_tag: ${{ needs.resolve-tag.outputs.native_release_tag }}
      tag: ${{ needs.resolve-tag.outputs.tag }}
      llama_cpp_ref: ${{ needs.resolve-tag.outputs.llama_cpp_ref }}
      llama_cpp_commit: ${{ needs.resolve-tag.outputs.llama_cpp_commit }}
      native_commit: ${{ needs.package-and-release.outputs.native_commit }}
      correlation_id: ${{ needs.resolve-tag.outputs.correlation_id }}
      smoke_conclusion: ${{ needs.smoke-release-contract.outputs.conclusion }}
      workflow_run_id: ${{ github.run_id }}
      workflow_run_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      release_url: ${{ steps.release.outputs.url }}
      publication_artifact_id: ${{ needs.package-and-release.outputs.publication_artifact_id }}
      publication_artifact_url: ${{ needs.package-and-release.outputs.publication_artifact_url }}
      publication_artifact_digest: ${{ needs.package-and-release.outputs.publication_artifact_digest }}
      result_artifact_id: ${{ steps.upload-result.outputs.artifact-id }}
      result_artifact_url: ${{ steps.upload-result.outputs.artifact-url }}
      result_artifact_digest: ${{ steps.upload-result.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download verified publication transaction
        uses: actions/download-artifact@v8
        with:
          name: release-publication-${{ github.run_id }}
          path: prepared
      - name: Read exact published release metadata
        id: release
        if: ${{ needs.resolve-tag.outputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ needs.resolve-tag.outputs.native_release_tag }}" > release-metadata.json
          python3 -c 'import json, pathlib, sys; print("url=" + json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))["html_url"])' release-metadata.json >> "$GITHUB_OUTPUT"
      - name: Generate exact machine-readable release result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PUBLISH_RELEASE: ${{ needs.resolve-tag.outputs.publish_release }}
        run: |
          release_args=()
          if [ "$INPUT_PUBLISH_RELEASE" = "true" ]; then
            release_args+=(--release-metadata release-metadata.json)
          fi
          python3 scripts/release_contract.py release-result \
            --assets-dir prepared/release_assets \
            "${release_args[@]}" \
            --native-release-tag "${{ needs.resolve-tag.outputs.native_release_tag }}" \
            --upstream-ref "${{ needs.resolve-tag.outputs.llama_cpp_ref }}" \
            --upstream-commit "${{ needs.resolve-tag.outputs.llama_cpp_commit }}" \
            --native-commit "${{ needs.package-and-release.outputs.native_commit }}" \
            --correlation-id "${{ needs.resolve-tag.outputs.correlation_id }}" \
            --smoke-policy "${{ needs.resolve-tag.outputs.smoke_policy }}" \
            --smoke-conclusion "${{ needs.smoke-release-contract.outputs.conclusion }}" \
            --publish-release "$INPUT_PUBLISH_RELEASE" \
            --workflow-repository "$GITHUB_REPOSITORY" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --workflow-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --workflow-head-sha "$GITHUB_SHA" \
            --publication-artifact-id "${{ needs.package-and-release.outputs.publication_artifact_id }}" \
            --publication-artifact-url "${{ needs.package-and-release.outputs.publication_artifact_url }}" \
            --publication-artifact-digest "${{ needs.package-and-release.outputs.publication_artifact_digest }}" \
            --output native-release-result.json
      - name: Report exact release result
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("native-release-result.json").read_text())
          print("## Native release result")
          print()
          print(f"- Status: `{result['status']}`")
          print(f"- Correlation: `{result['correlation_id']}`")
          print(f"- Native tag: `{result['native_release_tag']}`")
          print(f"- Upstream: `{result['llama_cpp_ref']}` at `{result['llama_cpp_commit']}`")
          print(f"- Native commit: `{result['native_commit']}`")
          print(f"- Smoke: `{result['smoke']['policy']}/{result['smoke']['conclusion']}`")
          print(f"- Bundle coverage complete: `{result['bundle_coverage']['complete']}`")
          print(f"- Publication artifact digest: `{result['publication_artifact']['digest']}`")
          if result["release"]:
              print(f"- Release: {result['release']['url']}")
          PY
      - name: Upload exact release result
        id: upload-result
        uses: actions/upload-artifact@v7
        with:
          name: native-release-result-${{ github.run_id }}
          path: native-release-result.json
          if-no-files-found: error
          retention-days: 30
