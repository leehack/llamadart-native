name: Metal OS Floor

# ggml embeds Metal source and compiles it on the user's device, with that OS's
# compiler. A build on a current Xcode or runner says nothing about older ones.
on:
  pull_request:
    paths:
      - .github/workflows/metal_os_floor.yml
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - patches/llama.cpp/**
      - third_party/llama.cpp
      - tools/apple/compile_metal_kernels.m
      - tools/extract_metal_kernels.py
      - tools/llama_cpp_patches.py
  workflow_call:
    inputs:
      artifact:
        description: Artifact holding the libllamadart.dylib to check.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Build the shipped macOS configuration
        run: python3 tools/build.py apple --target macos-arm64
      - uses: actions/upload-artifact@v7
        with:
          name: metal_os_floor_dylib
          path: bin/macos/arm64/libllamadart.dylib

  compile-macos:
    needs: build
    # A release passes its own artifact, and build is skipped.
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # The macOS floor, the last macOS before the 26 compilers, and the current one.
        runner: [macos-14, macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact || 'metal_os_floor_dylib' }}
          path: artifact
      - name: Compile every embedded kernel with this OS's Metal compiler
        run: |
          python3 tools/extract_metal_kernels.py artifact/libllamadart.dylib kernels
          clang -fobjc-arc -framework Foundation -framework Metal \
            tools/apple/compile_metal_kernels.m -o compile_metal_kernels
          ./compile_metal_kernels kernels

  compile-ios-simulator:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest iOS and the newest iOS 18 on these runners; a simulator
        # runtime brings that iOS version's Metal compiler. No runner has iOS 16.
        include:
          - runner: macos-14
            runtime: iOS-17-0
          - runner: macos-15
            runtime: iOS-18-6
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact || 'metal_os_floor_dylib' }}
          path: artifact
      - name: Compile every embedded kernel with this iOS version's Metal compiler
        env:
          RUNTIME: com.apple.CoreSimulator.SimRuntime.${{ matrix.runtime }}
        run: |
          python3 tools/extract_metal_kernels.py artifact/libllamadart.dylib kernels
          clang -target arm64-apple-ios16.4-simulator \
            -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
            -fobjc-arc -framework Foundation -framework Metal \
            tools/apple/compile_metal_kernels.m -o compile_metal_kernels
          device_type="$(xcrun simctl list devicetypes -j | python3 -c '
          import json, sys
          print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"]
                     if d["name"].startswith("iPhone")))')"
          simulator="$(xcrun simctl create metal-floor "$device_type" "$RUNTIME")"
          xcrun simctl bootstatus "$simulator" -b > /dev/null
          xcrun simctl spawn "$simulator" "$PWD/compile_metal_kernels" "$PWD/kernels"
