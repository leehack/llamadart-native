name: Detect Native Release Candidate

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-native-release
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Detect unbuilt stable upstream tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag="$(gh api repos/ggml-org/llama.cpp/releases/latest --jq '.tag_name')"
          if [ -z "$tag" ]; then
            echo "Failed to resolve latest llama.cpp tag" >&2
            exit 1
          fi
          echo "Latest upstream llama.cpp tag: $tag"

          # releases/latest is the stable channel only. Fail closed if upstream
          # ever points it at a nightly, prerelease, or otherwise unsupported ref.
          python3 scripts/release_version_policy.py \
            --upstream-ref "$tag" \
            --native-tag "$tag" \
            --require-stable-upstream >/dev/null

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists in $GITHUB_REPOSITORY; nothing to do."
            exit 0
          fi

          {
            echo "## Native release candidate"
            echo
            echo "Detected unbuilt stable upstream tag: $tag"
            echo
            echo "Publication requires explicit cross-repository approval through central llamadart orchestration."
            echo "After approval, dispatch native_release.yml manually with llama_cpp_tag=$tag and native_release_tag=$tag."
            echo "Companion repositories do not require dependency-pin PRs as a publication prerequisite."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Prepared candidate $tag for central orchestration; no release workflow was dispatched."
