name: Setup ccache
description: Restore a build lane's ccache directory and prime it for a fresh run.
inputs:
  cache-dir:
    description: ccache directory to cache between runs
    required: true
  max-size:
    description: Ceiling passed to ccache --max-size
    required: true
  key-prefix:
    description: Cache key prefix for this lane; the run id is appended
    required: true
  extra-restore-keys:
    description: Further restore-key prefixes, one per line, most specific first
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Restore ccache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.cache-dir }}
        key: ${{ inputs.key-prefix }}-${{ github.run_id }}
        restore-keys: |
          ${{ inputs.key-prefix }}-
          ${{ inputs.extra-restore-keys }}
    - name: Prime ccache
      shell: bash
      env:
        CCACHE_DIR: ${{ inputs.cache-dir }}
        CCACHE_MAXSIZE: ${{ inputs.max-size }}
      run: |
        mkdir -p "${CCACHE_DIR}"
        ccache --max-size "${CCACHE_MAXSIZE}"
        ccache --zero-stats
